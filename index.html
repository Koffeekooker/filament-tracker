<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Filament NFC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">

  <!--
    ========================================================================
    FILAMENT NFC – Spulenverwaltung für Android (Chrome + Web NFC)
    ========================================================================
    Jede Spule bekommt einen NFC-Tag (NTAG215/216). Auf dem Tag steht ALLES
    Wichtige, damit die Spule auch ohne diese App und ohne das Handy
    verständlich bleibt:

    Record 1 – MIME "application/json", OpenSpool-kompatibel (openspool.io):
      Standardfelder, die auch fremde Apps/Drucker verstehen:
        protocol, version, brand, type, subtype, color_hex,
        min_temp, max_temp, bed_min_temp, bed_max_temp
      Eigene Zusatzfelder (werden von anderen Lesern ignoriert):
        id  : 4-stellige Spulen-ID
        abr : 1 = abrasiv
        ew  : Leergewicht der Spule in g
        r   : Restgewicht Filament in g
        cfg : Druckerprofile, Schlüssel = Drucker-Code (z.B. "PCO"),
              Wert = kompakte, lesbare Zeile, z.B. "T215 B55 F0.98 PA0.04 MF15 R0.8/35"
                T  Düsentemp °C          B  Betttemp °C (optional, sonst global)
                F  Flow-Faktor           PA Pressure/Linear Advance
                MF Max. Volumenstrom mm³/s
                R  Retract Länge mm / Geschwindigkeit mm/s
              Damit passen 5 Druckerprofile auf einen NTAG215.

    Record 2 – Text (optional): Klartext-Zusammenfassung, die jede
      NFC-App (z.B. "NFC Tools") direkt anzeigt.

    Lokal im Browser (localStorage) liegen nur: Inventar-Kopie aller Spulen
    und die Stammdaten (Vorschlagslisten, Drucker). Backup über Export.
  ======================================================================== -->

  <style>
    :root {
      --bg: #121212; --bg-card: #1e1e1e; --bg-input: #2a2a2a;
      --text: #e0e0e0; --muted: #888; --primary: #0d6efd; --success: #198754; --danger: #dc3545;
      --border: #333;
    }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    .tabs { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    .tab-btn { flex: 1; padding: 15px 5px; font-weight: bold; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; margin: 0; border-radius: 0; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    .tab-content { display: none; padding: 15px; max-width: 600px; margin: 0 auto; }
    .tab-content.active { display: block; }

    h4 { margin: 0 0 10px; }
    .card { background: var(--bg-card); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .grid-4 input { padding: 8px 6px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .hint { font-size: 13px; color: var(--muted); }

    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--bg-input); color: white;
      border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    input[type="checkbox"] { width: auto; transform: scale(1.4); margin: 6px 10px 6px 4px; }
    input[type="color"] { padding: 2px; height: 42px; width: 56px; flex: none; }

    button { padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--bg-input); color: white; border: 1px solid var(--border); }
    .btn-small { padding: 6px 10px; font-size: 12px; width: auto; margin-bottom: 0; }

    #log { padding: 10px; background: var(--bg-input); border-left: 4px solid var(--primary); font-size: 13px; margin-bottom: 12px; min-height: 20px; }
    #sizeInfo { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
    .printer-profile { border: 1px solid #444; padding: 10px; border-radius: 6px; margin-bottom: 10px; background: #1a1a1a; }
    .printer-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; flex-wrap: wrap; }
    .swatch { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid #666; vertical-align: middle; margin-right: 6px; flex: none; }
    .inventory-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    details.card summary { font-weight: bold; cursor: pointer; padding: 2px 0; }
    details.card[open] summary { margin-bottom: 8px; }
    details.card ol, details.card ul { padding-left: 20px; margin: 6px 0; line-height: 1.45; font-size: 14px; }
    details.card p { font-size: 14px; line-height: 1.45; }
    code { background: var(--bg-input); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .list-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 5px; padding: 6px; background: #1a1a1a; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scanner', this)">Spule</button>
    <button class="tab-btn" onclick="switchTab('inventory', this)">Inventar</button>
    <button class="tab-btn" onclick="switchTab('settings', this)">Verwaltung<span id="settingsBadge" style="display:none; color:#ffc107;"> ●</span></button>
    <button class="tab-btn" onclick="switchTab('help', this)" style="flex:0.6;">Hilfe</button>
  </div>

  <!-- ===================== MODUL 1: SPULE ===================== -->
  <div id="scanner" class="tab-content active">

    <div class="card">
      <div class="grid-2">
        <div>
          <label>Tag-Typ</label>
          <select id="tagType" onchange="updateSizeInfo()">
            <option value="504" selected>NTAG215 (504 Bytes)</option>
            <option value="888">NTAG216 (888 Bytes)</option>
            <option value="144">NTAG213 (144 Bytes – zu klein)</option>
          </select>
        </div>
        <div>
          <label>Spulen-ID</label>
          <input type="text" id="tagId" readonly style="font-family: monospace; font-weight: bold;">
        </div>
      </div>
      <button class="btn-primary" onclick="readNFC()">NFC-Tag lesen</button>
      <div class="grid-2">
        <button class="btn-secondary" onclick="createNewSpool()">Neue Spule</button>
        <button class="btn-secondary" onclick="loadDemoTag()">Demo laden</button>
      </div>
      <div id="log">Bereit.</div>
    </div>

    <div class="card" style="border-left: 3px solid var(--primary);">
      <h4>Filament</h4>
      <label>Hersteller</label>
      <input type="text" id="inVendor" list="dlVendors" placeholder="z.B. Polymaker" oninput="updateSizeInfo()">
      <label>Material (Typ + Variante, z.B. "PLA CF")</label>
      <input type="text" id="inMaterial" list="dlMaterials" placeholder="z.B. PLA CF" oninput="updateSizeInfo()">
      <label>Farbe (Name + Farbwert)</label>
      <div class="row">
        <input type="text" id="inColorName" list="dlColors" placeholder="z.B. Schwarz" oninput="colorNameChanged()">
        <input type="color" id="inColorHex" value="#000000" style="margin-bottom:12px;" oninput="colorHexChanged()">
      </div>
      <label style="display:flex; align-items:center;">
        <input type="checkbox" id="chkAbrasive"> Abrasiv (gehärtete Düse nötig)
      </label>
      <div class="grid-3">
        <div><label>Düse min °C</label><input type="number" id="numTmin" inputmode="numeric"></div>
        <div><label>Düse max °C</label><input type="number" id="numTmax" inputmode="numeric"></div>
        <div><label>Bett °C</label><input type="number" id="numBed" inputmode="numeric"></div>
      </div>
      <div class="grid-3">
        <div><label>Leergewicht g</label><input type="number" id="numEmptyWt" inputmode="numeric" oninput="calcNetWeight()"></div>
        <div><label>Waage brutto g</label><input type="number" id="numScaleWt" inputmode="numeric" oninput="calcNetWeight()" placeholder="wiegen"></div>
        <div><label>Rest netto g</label><input type="number" id="numNetWt" inputmode="numeric" style="color:#00ff66;"></div>
      </div>
    </div>

    <div class="card" style="border-left: 3px solid #0dcaf0;">
      <h4>Druckerprofile</h4>
      <div id="printerProfilesContainer"></div>
      <label style="margin-top:10px;">Profil hinzufügen</label>
      <div class="row">
        <select id="selAddPrinter" style="margin:0;"></select>
        <button class="btn-secondary btn-small" style="padding:10px 14px;" onclick="addPrinterProfile()">+</button>
      </div>
    </div>

    <div class="card">
      <label style="display:flex; align-items:center;">
        <input type="checkbox" id="chkSummary" onchange="updateSizeInfo()"> Zusätzliche Klartext-Zeile (~70 Bytes, nur bei wenigen Profilen)
      </label>
      <div id="sizeInfo"></div>
      <button class="btn-success" onclick="saveToTag()">Auf NFC-Tag schreiben</button>
      <button class="btn-secondary" onclick="saveLocalOnly()">Nur lokal speichern</button>
    </div>
  </div>

  <!-- ===================== MODUL 2: INVENTAR ===================== -->
  <div id="inventory" class="tab-content">
    <div class="card">
      <div class="grid-2">
        <div><label>Suche</label><input type="search" id="invSearch" placeholder="Hersteller, Farbe, ID…" oninput="renderInventory()"></div>
        <div><label>Material</label><select id="invFilter" onchange="renderInventory()"></select></div>
      </div>
    </div>
    <div id="inventoryList"></div>
  </div>

  <!-- ===================== MODUL 3: VERWALTUNG ===================== -->
  <div id="settings" class="tab-content">
    <div class="card">
      <h4>Sprache / Language</h4>
      <select id="selLang" onchange="setLang(this.value)" style="margin:0;">
        <option value="auto">Automatisch / Automatic</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </div>
    <p class="hint">Vorschlagslisten für die Eingabefelder. Auf dem Tag steht immer der Klartext – diese Listen sind nur eine Eingabehilfe.</p>
    <div id="settingsSections"></div>

    <div class="card">
      <h4>Datensicherung</h4>
      <div id="backupBar" style="display:none; padding:10px; background:#3a2f00; border-left:4px solid #ffc107; font-size:13px; margin-bottom:12px;">
        <span id="backupBarText"></span>
        <button class="btn-secondary btn-small" style="margin-top:8px; display:block;" onclick="manualBackup()">Jetzt sichern</button>
      </div>
      <div id="storageStatus" class="hint" style="padding:8px; background:#1a1a1a; border-radius:4px; margin-bottom:10px;"></div>
      <label style="display:flex; align-items:center;">
        <input type="checkbox" id="optDailyFile" onchange="setOpt('dailyFile', this.checked)"> An Sicherungsdatei erinnern (nach Änderungen, spätestens alle 7 Tage)
      </label>
      <label style="display:flex; align-items:center;">
        <input type="checkbox" id="optAutoAdd" onchange="setOpt('autoAdd', this.checked)"> Gelesene Tags automatisch ins Inventar übernehmen
      </label>
      <div id="autoBackupStatus" class="hint" style="padding:8px; background:#1a1a1a; border-radius:4px; margin:10px 0; display:none;"></div>
      <button class="btn-secondary" id="btnSnapshot" onclick="sendSnapshot(true)" style="display:none;">Jetzt Vollsicherung im Termux-Ordner anlegen</button>
      <p class="hint">Manuell sichern oder wiederherstellen (z.B. neues Handy):</p>
      <div class="grid-2">
        <button class="btn-secondary" onclick="manualBackup()">Backup exportieren</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Backup importieren</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importBackup(this.files[0])">
    </div>
  </div>

  <!-- ===================== MODUL 4: HILFE ===================== -->
  <div id="help" class="tab-content">
    <div id="helpContent"></div>
  </div>

  <datalist id="dlVendors"></datalist>
  <datalist id="dlMaterials"></datalist>
  <datalist id="dlColors"></datalist>

<script>
  // ===================================================================
  // MEHRSPRACHIGKEIT
  // Schlüssel ist immer der deutsche Text. Fehlt eine Übersetzung, wird
  // Deutsch angezeigt. Neue Sprache: weiteres Objekt in I18N + Option in
  // #selLang + Hilfetext in HELP ergänzen.
  // ===================================================================
  const I18N = { en: {} };
  I18N.en = {
    // Navigation
    "Spule": "Spool", "Inventar": "Inventory", "Verwaltung": "Settings", "Hilfe": "Help",
    // Spule
    "Tag-Typ": "Tag type", "NTAG213 (144 Bytes – zu klein)": "NTAG213 (144 bytes – too small)",
    "Spulen-ID": "Spool ID", "NFC-Tag lesen": "Read NFC tag", "Neue Spule": "New spool", "Demo laden": "Load demo",
    "Bereit.": "Ready.", "Hersteller": "Brand",
    "Material (Typ + Variante, z.B. \"PLA CF\")": "Material (type + variant, e.g. \"PLA CF\")",
    "Farbe (Name + Farbwert)": "Colour (name + value)",
    "Abrasiv (gehärtete Düse nötig)": "Abrasive (hardened nozzle required)",
    "Düse min °C": "Nozzle min °C", "Düse max °C": "Nozzle max °C", "Bett °C": "Bed °C",
    "Leergewicht g": "Empty spool g", "Waage brutto g": "Scale gross g", "Rest netto g": "Remaining net g",
    "Druckerprofile": "Printer profiles", "Düse °C": "Nozzle °C",
    "Bett leer = globaler Wert. PA = Pressure/Linear Advance.": "Empty bed = spool default. PA = pressure/linear advance.",
    "Profil hinzufügen": "Add profile",
    "Zusätzliche Klartext-Zeile (~70 Bytes, nur bei wenigen Profilen)": "Extra plain-text line (~70 bytes, only with few profiles)",
     "Nur lokal speichern": "Save locally only",
    "z.B. Polymaker": "e.g. Polymaker", "z.B. PLA CF": "e.g. PLA CF", "z.B. Schwarz": "e.g. Black", "wiegen": "weigh",
    "Noch keine Profile auf dieser Spule.": "No profiles on this spool yet.", "unbekannt": "unknown",
    "Tag-Belegung: {size} / {cap} Bytes": "Tag usage: {size} / {cap} bytes", "zu groß": "too large",
    // Meldungen
    "Neue Spule angelegt. Werte ausfüllen, dann speichern.": "New spool created. Fill in the values, then save.",
    "Demo-Spule geladen (ohne NFC).": "Demo spool loaded (no NFC).",
    "Erst eine Spule lesen oder neu anlegen.": "Read or create a spool first.",
    "Profil {code} von dieser Spule entfernen?": "Remove profile {code} from this spool?",
    "Keine Spule geladen. Tag lesen oder 'Neue Spule'.": "No spool loaded. Read a tag or tap 'New spool'.",
    "Bitte mindestens Hersteller und Material angeben.": "Please enter at least brand and material.",
    "Spule {id} lokal gespeichert (Tag nicht verändert).": "Spool {id} saved locally (tag unchanged).",
    "Zu groß für den Tag ({size}/{cap} Bytes). Zusammenfassung abwählen oder Profile reduzieren.": "Too large for the tag ({size}/{cap} bytes). Untick the plain-text line or remove profiles.",
    "Jetzt Handy an den Tag halten… ({size}/{cap} Bytes)": "Now hold the phone to the tag… ({size}/{cap} bytes)",
    "Auf Tag geschrieben und gespeichert ({size}/{cap} Bytes).": "Written to tag and saved ({size}/{cap} bytes).",
    "NFC-Schreibfehler: {err}": "NFC write error: {err}", "Auf NFC-Tag schreiben": "Write to NFC tag",
    "Auf Tag geschrieben ({size}/{cap} Bytes).": "Written to tag ({size}/{cap} bytes).",
    "Web NFC nicht verfügbar – Chrome auf Android über https:// oder localhost nötig.": "Web NFC not available – requires Chrome on Android via https:// or localhost.",
    "Scanner aktiv – Handy an die Spule halten…": "Scanner active – hold the phone to the spool…",
    "Tag nicht lesbar – nochmal versuchen.": "Tag not readable – please try again.",
    "NFC-Fehler: ": "NFC error: ",
    "Tag gelesen, aber kein Spulen-Format (OpenSpool) gefunden.": "Tag read, but no spool data (OpenSpool) found.",
    "Leerer Tag – 'Neue Spule' anlegen und schreiben.": "Empty tag – create a 'New spool' and write it.",
    "Fremder OpenSpool-Tag – neue ID vergeben, beim Speichern wird sie ergänzt.": "Foreign OpenSpool tag – a new ID was assigned and will be added when saving.",
    "Ins Inventar übernommen.": "Added to inventory.",
    "Spule {id} gelesen: {name}.": "Spool {id} read: {name}.", "noch nicht im Inventar": "not in inventory yet",
    "Spule {id} aus dem Inventar geladen.": "Spool {id} loaded from inventory.",
    "Profil \"{name}\" exportiert (Ordner Downloads).": "Profile \"{name}\" exported (Downloads folder).",
    // Inventar
    "Suche": "Search", "Alle": "All", "Hersteller, Farbe, ID…": "Brand, colour, ID…",
    "Keine Spulen gefunden.": "No spools found.",
    "{n} Spule(n), zusammen {g} g. Antippen zum Bearbeiten.": "{n} spool(s), {g} g in total. Tap to edit.",
    "Rest": "Remaining", "keine Profile": "no profiles",
    "Spule {id} aus dem Inventar löschen? (Der Tag bleibt unverändert.)": "Delete spool {id} from the inventory? (The tag stays unchanged.)",
    // Verwaltung
    "Vorschlagslisten für die Eingabefelder. Auf dem Tag steht immer der Klartext – diese Listen sind nur eine Eingabehilfe.": "Suggestion lists for the input fields. The tag always stores plain text – these lists are just an input aid.",
    "Drucker": "Printers", "Farben": "Colours", "Materialien": "Materials",
    "Der Code steht auf dem Tag (kurz halten). Die Firmware bestimmt den Pressure-Advance-Befehl im PrusaSlicer-Export.": "The code is stored on the tag (keep it short). The firmware decides the pressure advance command in the PrusaSlicer export.",
    "kein Farbwert – antippen zum Festlegen": "no colour value – tap to set",
    "Neue Farbe: Farbwert wählen, Namen vergeben": "New colour: pick a value, give it a name",
    "z.B. Galaxy Lila": "e.g. Galaxy Purple", "z.B. Extrudr": "e.g. Extrudr", "z.B. PETG HF": "e.g. PETG HF",
    "Neue Hersteller, Materialien und Farben landen außerdem automatisch in den Listen, sobald du eine Spule damit speicherst.": "New brands, materials and colours are also added to the lists automatically when you save a spool with them.",
    "Code nur aus Buchstaben/Ziffern.": "Code may only contain letters and digits.",
    "Code {code} existiert schon. Überschreiben?": "Code {code} already exists. Overwrite?",
    "{code} wird von {n} Spule(n) verwendet. Trotzdem löschen? (Profile auf den Spulen bleiben erhalten)": "{code} is used by {n} spool(s). Delete anyway? (Profiles on the spools are kept)",
    "Drucker {code} löschen?": "Delete printer {code}?",
    "Bitte einen Namen für die Farbe eingeben.": "Please enter a name for the colour.",
    "Der Farbwert {hex} heißt schon \"{same}\". Trotzdem zusätzlich als \"{name}\" anlegen?": "Colour value {hex} is already called \"{same}\". Add it as \"{name}\" as well?",
    "\"{name}\" existiert schon ({hex}). Farbwert überschreiben?": "\"{name}\" already exists ({hex}). Overwrite colour value?",
    // Datensicherung
    "Datensicherung": "Backup",
    "Jetzt sichern": "Back up now",
    "An Sicherungsdatei erinnern (nach Änderungen, spätestens alle 7 Tage)": "Remind me to save a backup file (after changes, at least every 7 days)",
    "Letzte Sicherungsdatei vor {d} Tagen – es gibt neue Änderungen.": "Last backup file {d} days ago – there are new changes.",
    "Noch keine Sicherungsdatei angelegt.": "No backup file created yet.",
    "Tägliche Sicherungsdatei in „Downloads“ (beim ersten Speichern des Tages)": "Daily backup file in “Downloads” (on the first save of the day)",
    "Gelesene Tags automatisch ins Inventar übernehmen": "Add scanned tags to the inventory automatically",
    "Jetzt Vollsicherung im Termux-Ordner anlegen": "Create full backup in the Termux folder now",
    "Manuell sichern oder wiederherstellen (z.B. neues Handy):": "Back up or restore manually (e.g. new phone):",
    "Backup exportieren": "Export backup", "Backup importieren": "Import backup",
    "Daten dauerhaft gespeichert (Android löscht sie nicht bei Speichermangel).": "Data stored persistently (Android won't delete it when storage runs low).",
    "Speicher nicht als dauerhaft markiert – App über „Installieren“ hinzufügen.": "Storage not marked as persistent – add the app via “Install”.",
    "noch keine": "none yet",
    "Letzte Sicherungsdatei: {d} · {n} Spule(n) im Inventar": "Last backup file: {d} · {n} spool(s) in inventory",
    "Backup vom {date} mit {n} Spule(n) importieren? Aktuelle Daten werden ersetzt.": "Import backup from {date} with {n} spool(s)? Current data will be replaced.",
    "Backup importiert.": "Backup imported.", "Import fehlgeschlagen: ": "Import failed: ",
    "Keine gültige Backup-Datei": "Not a valid backup file",
    "Vollsicherung gespeichert: ": "Full backup saved: ", "Sicherung fehlgeschlagen: ": "Backup failed: ",
    "Auto-Backup aktiv · letzte Vollsicherung: {d}": "Auto backup active · last full backup: {d}",
    "{n} Änderung(en) warten": "{n} change(s) pending", "alle Änderungen gesichert": "all changes saved",
    "Termux-Server nicht erreichbar.": "Termux server not reachable.",
    "{n} Änderung(en) werden nachgeholt, sobald er läuft.": "{n} change(s) will be sent once it is running.",
    "Keine lokalen Daten, aber eine Sicherung mit {n} Spule(n) gefunden. Wiederherstellen?": "No local data, but a backup with {n} spool(s) was found. Restore?"
  };
  const LANG = (() => {
    let l = 'auto';
    try { l = localStorage.getItem('fnfc_lang') || 'auto'; } catch (e) {}
    if (l === 'auto') l = (navigator.language || 'de').slice(0, 2).toLowerCase();
    return (l === 'de' || I18N[l]) ? l : 'en';
  })();
  document.documentElement.lang = LANG;

  function t(key, params) {
    let s = (LANG !== 'de' && I18N[LANG] && I18N[LANG][key]) || key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] ?? m));
    return s;
  }

  // Übersetzt feste Texte im HTML (Textknoten, Platzhalter, Titel) – auch später
  // per innerHTML eingefügte Elemente, über einen MutationObserver.
  function translateNode(root) {
    if (LANG === 'de') return;
    const dict = I18N[LANG] || {};
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walk.nextNode()) nodes.push(walk.currentNode);
    if (root.nodeType === 3) nodes.push(root);
    for (const n of nodes) {
      const raw = n.nodeValue, key = raw.trim();
      if (key && dict[key]) n.nodeValue = raw.replace(key, dict[key]);
    }
    if (root.querySelectorAll) {
      for (const el of [root, ...root.querySelectorAll('[placeholder],[title]')]) {
        for (const a of ['placeholder', 'title']) {
          const v = el.getAttribute && el.getAttribute(a);
          if (v && dict[v]) el.setAttribute(a, dict[v]);
        }
      }
    }
  }
  function setLang(l) { try { localStorage.setItem('fnfc_lang', l); } catch (e) {} location.reload(); }

  // ===================================================================
  // Stammdaten (nur Eingabehilfe) und Drucker
  // fw = Firmware-Familie, bestimmt den Pressure-Advance-Befehl im PrusaSlicer-Export
  // ===================================================================
  const DEFAULT_SETTINGS = {
    vendors: ["Polymaker", "Prusament", "Sunlu", "eSun", "Bambu Lab", "Elegoo"],
    materials: ["PLA", "PLA CF", "PLA Silk", "PETG", "PETG CF", "ABS", "ASA", "TPU", "PA CF", "PC"],
    colors: { "Schwarz": "#1A1A1A", "Weiß": "#F5F5F5", "Grau": "#8A8A8A", "Rot": "#C62828", "Blau": "#1565C0", "Grün": "#2E7D32", "Gelb": "#F9D71C", "Orange": "#EF6C00", "Natur": "#E8E0C8" },
    printers: {
      "PCO": { name: "Prusa CoreOne", fw: "prusa" },
      "SU1": { name: "Snapmaker U1",  fw: "klipper" },
      "V0":  { name: "Voron 0",       fw: "klipper" },
      "PMI": { name: "Prusa Mini",    fw: "prusa" }
    }
  };
  const FW_LABELS = { prusa: "Prusa (M572)", klipper: "Klipper (SET_PRESSURE_ADVANCE)", marlin: "Marlin (M900)" };
  const DEFAULT_PROFILE = { t: 215, f: 1.0, pa: 0.0, mf: 12, rd: 0.8, rs: 35 };
  const PROFILE_FIELDS = [
    ['t', 'Düse °C', '1'], ['b', 'Bett °C', '1'], ['f', 'Flow', '0.01'],
    ['pa', 'PA', '0.001'], ['mf', 'Max mm³/s', '0.5'], ['rd', 'Retr. mm', '0.1'], ['rs', 'Retr. mm/s', '1']
  ];

  // ---------------- Hilfsfunktionen ----------------
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const $ = id => document.getElementById(id);
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function num(v, fallback = 0) {
    const n = parseFloat(String(v ?? "").replace(',', '.'));
    return isNaN(n) ? fallback : n;
  }
  const utf8Len = s => new TextEncoder().encode(s).length;

  if (LANG !== 'de') DEFAULT_SETTINGS.colors = { "Black": "#1A1A1A", "White": "#F5F5F5", "Grey": "#8A8A8A", "Red": "#C62828", "Blue": "#1565C0", "Green": "#2E7D32", "Yellow": "#F9D71C", "Orange": "#EF6C00", "Natural": "#E8E0C8" };
  let settings = loadJSON('fnfc_settings', null) || clone(DEFAULT_SETTINGS);
  for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
  // Vordefinierte Farben ohne gültigen Farbwert mit dem Standardwert ergänzen
  for (const n in settings.colors) {
    if (!/^#[0-9a-f]{6}$/i.test(String(settings.colors[n] || '')) && DEFAULT_SETTINGS.colors[n]) settings.colors[n] = DEFAULT_SETTINGS.colors[n];
  }
  let spools = loadJSON('fnfc_spools', []);
  if (!Array.isArray(spools)) spools = [];
  const saveSettings = () => { localStorage.setItem('fnfc_settings', JSON.stringify(settings)); journal({ op: 'settings', data: settings }); };
  const saveSpools = () => localStorage.setItem('fnfc_spools', JSON.stringify(spools));

  // ---------------- Datenmodell einer Spule ----------------
  // Intern arbeiten wir mit "spool"; erst beim Schreiben wird daraus das Tag-JSON.
  function emptySpool() {
    return { id: "", brand: "", material: "", cn: "", hex: "#000000", abr: 0,
             tmin: 0, tmax: 0, bed: 0, ew: 0, r: 0, cfg: {} };
  }
  let cur = emptySpool();

  // Material "PLA CF" -> OpenSpool type "PLA", subtype "CF"
  function splitMaterial(m) {
    const parts = String(m).trim().split(/\s+/);
    return { type: (parts.shift() || "").toUpperCase(), subtype: parts.join(" ") };
  }

  // Spule -> Tag-JSON (OpenSpool + Zusatzfelder)
  function toTagJSON(s) {
    const { type, subtype } = splitMaterial(s.material);
    const o = { protocol: "openspool", version: "1.0", brand: s.brand || "Generic", type: type || "PLA" };
    if (subtype) o.subtype = subtype;
    o.color_hex = (s.hex || "#000000").toUpperCase();
    if (s.tmin) o.min_temp = String(s.tmin);
    if (s.tmax) o.max_temp = String(s.tmax);
    if (s.bed) { o.bed_min_temp = s.bed; o.bed_max_temp = s.bed; }
    o.id = s.id;
    if (s.abr) o.abr = 1;
    o.ew = s.ew; o.r = s.r;
    o.cfg = {};
    for (const code in s.cfg) o.cfg[code] = profileToString(s.cfg[code]);
    return o;
  }

  // Profil-Objekt -> "T215 B55 F0.98 PA0.04 MF15 R0.8/35"
  function profileToString(p) {
    const parts = [`T${p.t}`];
    if (p.b !== undefined && p.b !== null && p.b !== '') parts.push(`B${p.b}`);
    parts.push(`F${p.f}`, `PA${p.pa}`, `MF${p.mf}`, `R${p.rd}/${p.rs}`);
    return parts.join(' ');
  }

  // Lesbare Zeile -> Profil-Objekt (alte Objekt-Schreibweise wird auch akzeptiert)
  function profileFromString(v) {
    if (v && typeof v === 'object') return clone(v);
    const p = {};
    for (const tok of String(v).trim().split(/\s+/)) {
      const m = tok.match(/^(PA|MF|T|B|F|R)(.+)$/i);
      if (!m) continue;
      const key = m[1].toUpperCase(), val = m[2];
      if (key === 'R') { const [rd, rs] = val.split('/'); p.rd = num(rd); if (rs !== undefined) p.rs = num(rs); }
      else p[{ T: 't', B: 'b', F: 'f', PA: 'pa', MF: 'mf' }[key]] = num(val);
    }
    return Object.assign(clone(DEFAULT_PROFILE), p);
  }

  // Tag-JSON (auch fremde OpenSpool-Tags) -> Spule
  function fromTagJSON(o) {
    const s = emptySpool();
    s.id = o.id || "";
    s.brand = o.brand || "";
    s.material = [o.type, o.subtype].filter(Boolean).join(" ");
    let hex = String(o.color_hex || "000000").replace('#', '');
    s.hex = /^[0-9a-f]{6}/i.test(hex) ? '#' + hex.slice(0, 6).toUpperCase() : "#000000";
    // Farbname steht nicht auf dem Tag – über den Farbwert aus der Farbliste ermitteln
    s.cn = o.cn || colorNameForHex(s.hex);
    s.abr = o.abr ? 1 : 0;
    s.tmin = num(o.min_temp); s.tmax = num(o.max_temp);
    s.bed = num(o.bed_max_temp ?? o.bed_min_temp);
    s.ew = num(o.ew); s.r = num(o.r);
    s.cfg = {};
    if (o.cfg && typeof o.cfg === 'object') for (const code in o.cfg) s.cfg[code] = profileFromString(o.cfg[code]);
    return s;
  }

  function colorNameForHex(hex) {
    const h = String(hex).toUpperCase();
    return Object.keys(settings.colors).find(n => String(settings.colors[n]).toUpperCase() === h) || "";
  }

  // Klartext für Record 2 – das sieht jeder mit einer beliebigen NFC-App
  function summaryText(s) {
    const parts = [`${s.brand || '?'} ${s.material || '?'}${s.cn ? ' ' + s.cn : ''}`];
    if (s.tmin || s.tmax) parts.push(`${s.tmin || '?'}-${s.tmax || '?'}°C`);
    if (s.bed) parts.push(`Bett ${s.bed}°C`);
    if (s.abr) parts.push('abrasiv');
    return parts.join(' | ');
  }

  // Exakter NDEF-Platzbedarf (Record-Header + TLV + Terminator)
  function ndefSize(jsonStr, text) {
    const rec = (typeLen, payloadLen) => 2 + (payloadLen < 256 ? 1 : 4) + typeLen + payloadLen;
    let msg = rec(16, utf8Len(jsonStr));              // "application/json" = 16 Zeichen
    if (text) msg += rec(1, 3 + utf8Len(text));        // Typ "T", Status-Byte + "en"
    return msg + (msg < 255 ? 2 : 4) + 1;
  }

  // ---------------- UI ----------------
  function updateLog(msg, isError = false) {
    $('log').innerText = msg;
    $('log').style.borderLeftColor = isError ? 'var(--danger)' : 'var(--primary)';
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    $(tabId).classList.add('active');
    if (btn) btn.classList.add('active');
    if (tabId === 'inventory') renderInventory();
    if (tabId === 'settings') showStorageStatus();
    window.scrollTo(0, 0);
  }

  function initApp() {
    refreshLists();
    renderSettings();
    renderForm();
    renderInventory();
  }

  function refreshLists() {
    $('dlVendors').innerHTML = settings.vendors.map(v => `<option value="${esc(v)}">`).join('');
    $('dlMaterials').innerHTML = settings.materials.map(v => `<option value="${esc(v)}">`).join('');
    $('dlColors').innerHTML = Object.keys(settings.colors).map(v => `<option value="${esc(v)}">`).join('');
    updateAddPrinterDropdown();
  }

  // Bekannter Farbname gewählt -> Farbwert automatisch setzen
  function colorNameChanged() {
    const hex = settings.colors[$('inColorName').value.trim()];
    if (hex) $('inColorHex').value = hex;
    updateSizeInfo();
  }

  function generateID() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let id;
    do { id = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); }
    while (spools.some(s => s.id === id));
    return id;
  }

  function createNewSpool() {
    cur = emptySpool();
    cur.id = generateID();
    cur.ew = 250; cur.r = 1000; cur.tmin = 200; cur.tmax = 230; cur.bed = 60;
    $('numScaleWt').value = "";
    renderForm();
    updateLog(t("Neue Spule angelegt. Werte ausfüllen, dann speichern."));
  }

  function loadDemoTag() {
    cur = fromTagJSON({
      protocol: "openspool", version: "1.0", brand: "Polymaker", type: "PLA", subtype: "CF",
      color_hex: "#1A1A1A", min_temp: "210", max_temp: "230", bed_min_temp: 60, bed_max_temp: 60,
      id: "x7b9", abr: 1, ew: 250, r: 685,
      cfg: { "PCO": { t: 215, f: 0.98, pa: 0.04, mf: 15, rd: 0.8, rs: 35 },
             "SU1": { t: 220, b: 55, f: 1.0, pa: 0.06, mf: 12, rd: 1.2, rs: 40 } }
    });
    $('numScaleWt').value = "";
    renderForm();
    updateLog(t("Demo-Spule geladen (ohne NFC)."));
  }

  function renderForm() {
    $('tagId').value = cur.id;
    $('inVendor').value = cur.brand;
    $('inMaterial').value = cur.material;
    $('inColorName').value = cur.cn;
    $('inColorHex').value = cur.hex || "#000000";
    $('chkAbrasive').checked = !!cur.abr;
    $('numTmin').value = cur.tmin || "";
    $('numTmax').value = cur.tmax || "";
    $('numBed').value = cur.bed || "";
    $('numEmptyWt').value = cur.ew || "";
    $('numNetWt').value = cur.r || "";
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  // Formular -> cur
  function collectForm() {
    cur.brand = $('inVendor').value.trim();
    cur.material = $('inMaterial').value.trim();
    cur.cn = $('inColorName').value.trim();
    cur.hex = $('inColorHex').value;
    cur.abr = $('chkAbrasive').checked ? 1 : 0;
    cur.tmin = num($('numTmin').value);
    cur.tmax = num($('numTmax').value);
    cur.bed = num($('numBed').value);
    cur.ew = num($('numEmptyWt').value);
    cur.r = Math.round(num($('numNetWt').value));
  }

  function calcNetWeight() {
    const scale = parseFloat($('numScaleWt').value);
    if (!isNaN(scale)) $('numNetWt').value = Math.max(0, Math.round(scale - num($('numEmptyWt').value)));
  }

  function updateSizeInfo() {
    if (!cur.id) { $('sizeInfo').textContent = ""; return; }
    collectForm();
    const json = JSON.stringify(toTagJSON(cur));
    const withSum = $('chkSummary').checked;
    const size = ndefSize(json, withSum ? summaryText(cur) : null);
    const cap = parseInt($('tagType').value);
    $('sizeInfo').textContent = t('Tag-Belegung: {size} / {cap} Bytes', { size, cap }) + (size > cap ? '  ⚠ ' + t('zu groß') : '');
    $('sizeInfo').style.color = size > cap ? 'var(--danger)' : 'var(--muted)';
  }

  // ---------------- Druckerprofile ----------------
  function updateAddPrinterDropdown() {
    $('selAddPrinter').innerHTML = Object.entries(settings.printers)
      .filter(([code]) => !cur.cfg[code])
      .map(([code, p]) => `<option value="${esc(code)}">${esc(p.name)} (${esc(code)})</option>`).join('');
  }

  function addPrinterProfile() {
    if (!cur.id) { updateLog(t("Erst eine Spule lesen oder neu anlegen."), true); return; }
    const code = $('selAddPrinter').value;
    if (!code) return;
    const p = clone(DEFAULT_PROFILE);
    if (cur.tmin && cur.tmax) p.t = Math.round((cur.tmin + cur.tmax) / 2);
    cur.cfg[code] = p;
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  function removePrinterProfile(code) {
    if (!confirm(t('Profil {code} von dieser Spule entfernen?', { code }))) return;
    delete cur.cfg[code];
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  function setProfileValue(code, field, value) {
    if (!cur.cfg[code]) return;
    if (field === 'b' && String(value).trim() === '') delete cur.cfg[code].b;
    else cur.cfg[code][field] = num(value);
    updateSizeInfo();
  }

  function renderPrinterCards() {
    const codes = Object.keys(cur.cfg);
    if (!codes.length) { $('printerProfilesContainer').innerHTML = `<p class='hint'>${t('Noch keine Profile auf dieser Spule.')}</p>`; return; }
    $('printerProfilesContainer').innerHTML = codes.map(code => {
      const p = cur.cfg[code], c = esc(code);
      const name = settings.printers[code] ? settings.printers[code].name : code + ' (' + t('unbekannt') + ')';
      return `
        <div class="printer-profile">
          <div class="printer-header">
            <strong>${esc(name)}</strong>
            <div class="row">
              <button class="btn-secondary btn-small" onclick="exportProfile('${c}','prusa')">PrusaSlicer</button>
              <button class="btn-secondary btn-small" onclick="exportProfile('${c}','orca')">Orca</button>
              <button class="btn-danger btn-small" onclick="removePrinterProfile('${c}')">✕</button>
            </div>
          </div>
          <div class="grid-4">
            ${PROFILE_FIELDS.map(([k, label, step]) => `
              <div><label>${t(label)}</label><input type="number" inputmode="decimal" step="${step}" value="${esc(p[k] ?? '')}"
                oninput="setProfileValue('${c}','${k}',this.value)"></div>`).join('')}
          </div>
          <p class="hint" style="margin:0; font-size:11px;">${t('Bett leer = globaler Wert. PA = Pressure/Linear Advance.')}</p>
        </div>`;
    }).join('');
  }

  // ---------------- Speichern ----------------
  function storeLocal() {
    collectForm();
    const entry = clone(cur);
    entry.updated = new Date().toISOString();
    const i = spools.findIndex(s => s.id === cur.id);
    if (i >= 0) spools[i] = entry; else spools.push(entry);
    saveSpools();
    journal({ op: 'spool', data: entry });
    learnSuggestions();
    dailyFileBackup();
  }

  // Neue Hersteller/Materialien/Farben automatisch in die Vorschlagslisten übernehmen
  function learnSuggestions() {
    let changed = false;
    if (cur.brand && !settings.vendors.includes(cur.brand)) { settings.vendors.push(cur.brand); changed = true; }
    if (cur.material && !settings.materials.includes(cur.material)) { settings.materials.push(cur.material); changed = true; }
    if (cur.cn && !isHex(settings.colors[cur.cn])) { settings.colors[cur.cn] = cur.hex.toUpperCase(); changed = true; }
    if (changed) { saveSettings(); refreshLists(); renderSettings(); }
  }

  function validate() {
    if (!cur.id) { updateLog(t("Keine Spule geladen. Tag lesen oder 'Neue Spule'."), true); return false; }
    collectForm();
    if (!cur.brand || !cur.material) { updateLog(t("Bitte mindestens Hersteller und Material angeben."), true); return false; }
    return true;
  }

  function saveLocalOnly() {
    if (!validate()) return;
    storeLocal();
    updateLog(t('Spule {id} lokal gespeichert (Tag nicht verändert).', { id: cur.id }));
  }

  async function saveToTag() {
    if (!validate()) return;
    const json = JSON.stringify(toTagJSON(cur));
    const text = $('chkSummary').checked ? summaryText(cur) : null;
    const size = ndefSize(json, text);
    const cap = parseInt($('tagType').value);
    if (size > cap) {
      updateLog(t('Zu groß für den Tag ({size}/{cap} Bytes). Zusammenfassung abwählen oder Profile reduzieren.', { size, cap }), true);
      return;
    }
    if (!("NDEFReader" in window)) { updateLog(t("Web NFC nicht verfügbar – Chrome auf Android über https:// oder localhost nötig."), true); return; }

    const records = [{ recordType: "mime", mediaType: "application/json", data: new TextEncoder().encode(json) }];
    if (text) records.push({ recordType: "text", lang: "en", data: text });
    updateLog(t('Jetzt Handy an den Tag halten… ({size}/{cap} Bytes)', { size, cap }));
    try {
      await (nfcReader || new NDEFReader()).write({ records });
      // Erst nach erfolgreichem Schreiben: Inventar-Eintrag an den Tag-Inhalt angleichen
      storeLocal();
      updateLog('✔ ' + t('Auf Tag geschrieben ({size}/{cap} Bytes).', { size, cap }));
    } catch (err) {
      updateLog(t('NFC-Schreibfehler: {err}', { err: err.message || err }), true);
    }
  }

  // ---------------- NFC lesen ----------------
  let nfcReader = null;

  async function readNFC() {
    if (!("NDEFReader" in window)) { updateLog(t("Web NFC nicht verfügbar – Chrome auf Android über https:// oder localhost nötig."), true); return; }
    if (nfcReader) { updateLog(t("Scanner aktiv – Handy an die Spule halten…")); return; }
    try {
      nfcReader = new NDEFReader();
      await nfcReader.scan();
      updateLog(t("Scanner aktiv – Handy an die Spule halten…"));
      nfcReader.onreadingerror = () => updateLog(t("Tag nicht lesbar – nochmal versuchen."), true);
      nfcReader.onreading = ev => handleTag(ev.message.records);
    } catch (err) {
      nfcReader = null;
      updateLog(t("NFC-Fehler: ") + (err.message || err), true);
    }
  }

  function handleTag(records) {
    let data = null;
    for (const rec of records) {
      try {
        const isJsonMime = rec.recordType === "mime" && /json/i.test(rec.mediaType || "");
        if (!isJsonMime && rec.recordType !== "text") continue;
        const txt = new TextDecoder(rec.encoding || "utf-8").decode(rec.data);
        const o = JSON.parse(txt);
        if (o && (o.protocol === "openspool" || o.cfg)) { data = o; break; }
      } catch (e) { /* kein JSON – nächsten Record probieren */ }
    }
    if (!data) { updateLog(t(records.length ? "Tag gelesen, aber kein Spulen-Format (OpenSpool) gefunden." : "Leerer Tag – 'Neue Spule' anlegen und schreiben."), true); return; }

    cur = fromTagJSON(data);
    // Bekannte Spule: Farbname aus dem Inventar übernehmen, falls der Farbwert nicht in der Farbliste steht
    const inv = spools.find(s => s.id === cur.id);
    if (!cur.cn && inv && inv.hex === cur.hex) cur.cn = inv.cn || "";
    let note = "";
    if (!cur.id) { cur.id = generateID(); note = " " + t("Fremder OpenSpool-Tag – neue ID vergeben, beim Speichern wird sie ergänzt."); }
    $('numScaleWt').value = "";
    renderForm();
    switchTab('scanner', document.querySelector('.tab-btn'));
    let known = spools.some(s => s.id === cur.id);
    // Unbekannte Spule direkt ins Inventar – so lässt sich der Bestand nach Datenverlust
    // einfach durch Abscannen aller Spulen wiederherstellen (alle wichtigen Daten stehen auf dem Tag).
    if (!known && opts.autoAdd && !note) {
      const entry = clone(cur); entry.updated = new Date().toISOString();
      spools.push(entry); saveSpools(); journal({ op: 'spool', data: entry });
      known = true; note = " " + t("Ins Inventar übernommen.");
    }
    updateLog(t("Spule {id} gelesen: {name}.", { id: cur.id, name: cur.brand + " " + cur.material }) + (known ? "" : " (" + t("noch nicht im Inventar") + ")") + note);
  }

  // ---------------- Inventar ----------------
  function renderInventory() {
    const sel = $('invFilter');
    const old = sel.value || 'all';
    const mats = [...new Set(spools.map(s => s.material).filter(Boolean))].sort();
    sel.innerHTML = `<option value="all">${t('Alle')}</option>` + mats.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    sel.value = mats.includes(old) ? old : 'all';

    const q = $('invSearch').value.trim().toLowerCase();
    const list = spools.map((s, i) => ({ s, i }))
      .filter(({ s }) => sel.value === 'all' || s.material === sel.value)
      .filter(({ s }) => !q || [s.id, s.brand, s.material, s.cn].join(' ').toLowerCase().includes(q))
      .sort((a, b) => (a.s.brand + a.s.material).localeCompare(b.s.brand + b.s.material));

    if (!list.length) { $('inventoryList').innerHTML = `<p class='hint'>${t('Keine Spulen gefunden.')}</p>`; return; }
    const total = list.reduce((sum, { s }) => sum + num(s.r), 0);
    $('inventoryList').innerHTML =
      `<p class="hint">${t('{n} Spule(n), zusammen {g} g. Antippen zum Bearbeiten.', { n: list.length, g: Math.round(total) })}</p>` +
      list.map(({ s, i }) => `
        <div class="card inventory-item">
          <div class="row" style="cursor:pointer; flex:1;" onclick="loadFromInventory(${i})">
            <span class="swatch" style="background:${esc(s.hex)}"></span>
            <div>
              <strong>${esc(s.brand)} ${esc(s.material)}${s.cn ? ' – ' + esc(s.cn) : ''}</strong>${s.abr ? ' ⚠' : ''}<br>
              <span class="hint" style="font-size:12px;">ID ${esc(s.id)} · ${t('Rest')} ${esc(s.r)} g · ${esc(Object.keys(s.cfg || {}).join(', ') || t('keine Profile'))}</span>
            </div>
          </div>
          <button class="btn-danger btn-small" onclick="deleteSpool(${i})">✕</button>
        </div>`).join('');
  }

  function loadFromInventory(i) {
    if (!spools[i]) return;
    cur = Object.assign(emptySpool(), clone(spools[i]));
    delete cur.updated;
    $('numScaleWt').value = "";
    renderForm();
    switchTab('scanner', document.querySelector('.tab-btn'));
    updateLog(t('Spule {id} aus dem Inventar geladen.', { id: cur.id }));
  }

  function deleteSpool(i) {
    if (!confirm(t('Spule {id} aus dem Inventar löschen? (Der Tag bleibt unverändert.)', { id: spools[i].id }))) return;
    const id = spools[i].id;
    spools.splice(i, 1);
    saveSpools();
    journal({ op: 'delete', id });
    dailyFileBackup();
    renderInventory();
  }

  // ---------------- Slicer-Export ----------------
  function profileFor(code) {
    collectForm();
    const p = cur.cfg[code];
    const printer = settings.printers[code] || { name: code, fw: "klipper" };
    const { type } = splitMaterial(cur.material);
    const bed = p.b ?? cur.bed;
    const name = `${cur.brand} ${cur.material}${cur.cn ? ' ' + cur.cn : ''} @${printer.name}`;
    return { p, printer, type, bed, name };
  }

  function exportProfile(code, kind) {
    const { p, printer, type, bed, name } = profileFor(code);
    const safe = name.replace(/[^\w\-. @äöüÄÖÜß]+/g, '_');
    if (kind === 'prusa') {
      // PrusaSlicer Config-Bundle: Datei > Importieren > Config-Bundle importieren
      // Legt ein eigenes Filament-Preset an; nicht enthaltene Werte bekommen PrusaSlicer-Standardwerte.
      const paCmd = { prusa: `M572 S${p.pa}`, marlin: `M900 K${p.pa}`, klipper: `SET_PRESSURE_ADVANCE ADVANCE=${p.pa}` }[printer.fw] || '';
      const lines = [
        `# Erzeugt von Filament NFC – Spule ${cur.id}`,
        `[filament:${name}]`,
        `filament_vendor = ${cur.brand}`,
        `filament_type = ${type}`,
        `filament_colour = ${cur.hex.toUpperCase()}`,
        `temperature = ${p.t}`,
        `first_layer_temperature = ${p.t}`,
        `bed_temperature = ${bed}`,
        `first_layer_bed_temperature = ${bed}`,
        `extrusion_multiplier = ${p.f}`,
        `filament_max_volumetric_speed = ${p.mf}`,
        `filament_retract_length = ${p.rd}`,
        `filament_retract_speed = ${p.rs}`,
        `start_filament_gcode = "${p.pa ? paCmd : ''}"`,
        `filament_notes = "Spule ${cur.id}${cur.abr ? ', abrasiv' : ''}"`,
        ''
      ];
      download(`${safe}.ini`, lines.join('\n'), 'text/plain');
    } else {
      // OrcaSlicer: Datei > Importieren > Konfigurationen importieren
      const o = {
        type: "filament", name, from: "User", inherits: "", version: "2.3.0.0",
        filament_settings_id: [name],
        filament_vendor: [cur.brand],
        filament_type: [type],
        default_filament_colour: [cur.hex.toUpperCase()],
        nozzle_temperature: [String(p.t)],
        nozzle_temperature_initial_layer: [String(p.t)],
        nozzle_temperature_range_low: [String(cur.tmin || p.t)],
        nozzle_temperature_range_high: [String(cur.tmax || p.t)],
        hot_plate_temp: [String(bed)], hot_plate_temp_initial_layer: [String(bed)],
        textured_plate_temp: [String(bed)], textured_plate_temp_initial_layer: [String(bed)],
        filament_flow_ratio: [String(p.f)],
        enable_pressure_advance: [p.pa ? "1" : "0"],
        pressure_advance: [String(p.pa)],
        filament_max_volumetric_speed: [String(p.mf)],
        filament_retraction_length: [String(p.rd)],
        filament_retraction_speed: [String(p.rs)],
        filament_notes: `Spule ${cur.id}${cur.abr ? ', abrasiv' : ''}`,
        compatible_printers: []
      };
      download(`${safe}.json`, JSON.stringify(o, null, 4), 'application/json');
    }
    updateLog(t('Profil "{name}" exportiert (Ordner Downloads).', { name }));
  }

  function download(filename, content, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type: mime }));
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function addPrinter() {
    const code = $('addPrCode').value.trim().toUpperCase();
    const name = $('addPrName').value.trim();
    if (!code || !name) return;
    if (!/^[A-Z0-9]+$/.test(code)) { alert(t("Code nur aus Buchstaben/Ziffern.")); return; }
    if (settings.printers[code] && !confirm(t('Code {code} existiert schon. Überschreiben?', { code }))) return;
    settings.printers[code] = { name, fw: $('addPrFw').value };
    saveSettings(); refreshLists(); renderSettings(); renderPrinterCards();
  }

  function deletePrinter(code) {
    const used = spools.filter(s => s.cfg && s.cfg[code]).length;
    if (!confirm(used ? t('{code} wird von {n} Spule(n) verwendet. Trotzdem löschen? (Profile auf den Spulen bleiben erhalten)', { code, n: used }) : t('Drucker {code} löschen?', { code }))) return;
    delete settings.printers[code];
    saveSettings(); refreshLists(); renderSettings(); renderPrinterCards();
  }

  const isHex = h => /^#[0-9a-f]{6}$/i.test(String(h || ''));

  function setColorHex(name, hex) {
    settings.colors[name] = hex.toUpperCase();
    saveSettings(); refreshLists(); renderSettings();
  }

  function addColor() {
    const name = $('addColName').value.trim();
    const hex = $('addColHex').value.toUpperCase();
    if (!name) { alert(t("Bitte einen Namen für die Farbe eingeben.")); return; }
    const same = colorNameForHex(hex);
    if (same && same !== name && !confirm(t('Der Farbwert {hex} heißt schon "{same}". Trotzdem zusätzlich als "{name}" anlegen?', { hex, same, name }))) return;
    if (settings.colors[name] && !confirm(t('"{name}" existiert schon ({hex}). Farbwert überschreiben?', { name, hex: settings.colors[name] }))) return;
    settings.colors[name] = hex;
    saveSettings(); refreshLists(); renderSettings();
  }

  function addListItem(key) {
    const v = $('add_' + key).value.trim();
    if (!v || settings[key].includes(v)) return;
    settings[key].push(v);
    settings[key].sort((a, b) => a.localeCompare(b));
    saveSettings(); refreshLists(); renderSettings();
  }

  // Farbwert im Spulen-Formular geändert -> passenden Namen vorschlagen
  function colorHexChanged() {
    const name = colorNameForHex($('inColorHex').value);
    const curName = $('inColorName').value.trim();
    if (name && (!curName || settings.colors[curName])) $('inColorName').value = name;
    updateSizeInfo();
  }

  function deleteListItem(key, value) {
    if (key === 'colors') delete settings.colors[value];
    else settings[key] = settings[key].filter(v => v !== value);
    saveSettings(); refreshLists(); renderSettings();
  }

  // ---------------- Backup ----------------
  function exportBackup() {
    const data = { app: "filament-nfc", version: 2, exported: new Date().toISOString(), settings, spools };
    download(`filament-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
    localStorage.setItem('fnfc_lastFile', new Date().toISOString().slice(0, 10));
    localStorage.removeItem('fnfc_dirty');
  }

  async function importBackup(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.settings || !Array.isArray(data.spools)) throw new Error(t("Keine gültige Backup-Datei"));
      if (!confirm(t('Backup vom {date} mit {n} Spule(n) importieren? Aktuelle Daten werden ersetzt.', { date: data.exported || '?', n: data.spools.length }))) return;
      settings = data.settings;
      for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
      spools = data.spools;
      saveSettings(); saveSpools(); initApp();
      sendSnapshot(true);
      alert(t("Backup importiert."));
    } catch (e) { alert(t("Import fehlgeschlagen: ") + e.message); }
    finally { $('importFile').value = ""; }
  }

  // Formular-Änderungen live in die Größenanzeige übernehmen
  document.addEventListener('input', e => { if (e.target.closest('#scanner') && e.target.type !== 'checkbox') updateSizeInfo(); });

  // ===================================================================
  // AUTO-BACKUP über filament_server.py (Termux)
  // Jede Änderung geht als Journal-Eintrag an den Server (inkrementell),
  // einmal täglich zusätzlich ein Vollstand. Ist der Server nicht erreichbar,
  // werden Einträge gesammelt und später nachgeschickt.
  // ===================================================================
  let backupServer = false;
  let pending = loadJSON('fnfc_pending', []);

  function journal(entry) {
    if (!localStorage.getItem('fnfc_serverSeen')) return;   // kein Termux im Einsatz -> nichts sammeln
    entry.ts = new Date().toISOString();
    pending.push(entry);
    localStorage.setItem('fnfc_pending', JSON.stringify(pending));
    flushJournal();
  }

  async function flushJournal() {
    if (!backupServer || !pending.length) { showBackupStatus(); return; }
    const batch = pending.slice();
    try {
      const r = await fetch('/api/journal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(batch) });
      if (!r.ok) throw new Error(r.status);
      pending = pending.slice(batch.length);
      localStorage.setItem('fnfc_pending', JSON.stringify(pending));
    } catch (e) { /* Server weg – bleibt in der Warteschlange */ }
    showBackupStatus();
  }

  async function sendSnapshot(manual = false) {
    if (!backupServer) return;
    const data = { app: "filament-nfc", version: 2, exported: new Date().toISOString(), settings, spools };
    try {
      const r = await fetch('/api/snapshot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const res = await r.json();
      localStorage.setItem('fnfc_lastSnapshot', data.exported.slice(0, 10));
      showBackupStatus();
      if (manual) alert(t('Vollsicherung gespeichert: ') + 'backups/' + res.file);
    } catch (e) { if (manual) alert(t('Sicherung fehlgeschlagen: ') + e.message); }
  }

  function showBackupStatus() {
    const el = $('autoBackupStatus');
    if (!el) return;
    // Termux-Server ist optional: Status nur zeigen, wenn er läuft oder Änderungen warten
    el.style.display = (backupServer || pending.length) ? '' : 'none';
    const last = localStorage.getItem('fnfc_lastSnapshot') || '–';
    if (backupServer) {
      el.innerHTML = '✔ ' + t('Auto-Backup aktiv · letzte Vollsicherung: {d}', { d: esc(last) }) +
        (pending.length ? ` · <span style="color:#ffc107">${t('{n} Änderung(en) warten', { n: pending.length })}</span>` : ' · ' + t('alle Änderungen gesichert'));
      $('btnSnapshot').style.display = '';
    } else {
      el.innerHTML = t('Termux-Server nicht erreichbar.') +
        (pending.length ? ' ' + t('{n} Änderung(en) werden nachgeholt, sobald er läuft.', { n: pending.length }) : '');
      $('btnSnapshot').style.display = 'none';
    }
  }

  async function initBackup() {
    try {
      const r = await fetch('/api/ping', { cache: 'no-store' });
      backupServer = r.ok && (await r.json()).ok === true;
    } catch (e) { backupServer = false; }
    if (backupServer) localStorage.setItem('fnfc_serverSeen', '1');
    else if (!localStorage.getItem('fnfc_serverSeen') && pending.length) { pending = []; localStorage.removeItem('fnfc_pending'); }
    showBackupStatus();
    if (!backupServer) return;

    // Browserdaten gelöscht? Dann Stand vom Handy anbieten.
    if (!spools.length && !localStorage.getItem('fnfc_settings')) {
      try {
        const state = await (await fetch('/api/state', { cache: 'no-store' })).json();
        if (state.spools && state.spools.length &&
            confirm(t('Keine lokalen Daten, aber eine Sicherung mit {n} Spule(n) gefunden. Wiederherstellen?', { n: state.spools.length }))) {
          if (state.settings) settings = state.settings;
          for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
          spools = state.spools;
          localStorage.setItem('fnfc_settings', JSON.stringify(settings));
          saveSpools();
          initApp();
        }
      } catch (e) { /* keine Sicherung vorhanden */ }
    }

    await flushJournal();
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('fnfc_lastSnapshot') !== today && (spools.length || localStorage.getItem('fnfc_settings'))) sendSnapshot();
  }

  // ===================================================================
  // Speicherung ohne Server
  // ===================================================================
  let opts = Object.assign({ dailyFile: true, autoAdd: true }, loadJSON('fnfc_opts', {}));
  function setOpt(k, v) { opts[k] = v; localStorage.setItem('fnfc_opts', JSON.stringify(opts)); showStorageStatus(); }

  // Ohne Server darf ein Browser nicht still Dateien schreiben. Statt beim Speichern
  // (stört das NFC-Schreiben) einen Download auszulösen, merkt sich die App nur, dass
  // es Änderungen gibt, und zeigt nach spätestens 7 Tagen einen Hinweis mit Button.
  const BACKUP_DAYS = 7;
  function dailyFileBackup() {           // wird nach jeder Änderung aufgerufen
    localStorage.setItem('fnfc_dirty', '1');
    showBackupBar();
  }

  function showBackupBar() {
    const bar = $('backupBar');
    const last = localStorage.getItem('fnfc_lastFile');
    const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : Infinity;
    const due = opts.dailyFile && !backupServer && localStorage.getItem('fnfc_dirty') && spools.length && days >= BACKUP_DAYS;
    bar.style.display = due ? '' : 'none';
    $('settingsBadge').style.display = due ? '' : 'none';
    if (due) $('backupBarText').textContent = last
      ? t('Letzte Sicherungsdatei vor {d} Tagen – es gibt neue Änderungen.', { d: days })
      : t('Noch keine Sicherungsdatei angelegt.');
  }

  function manualBackup() {
    exportBackup();
    showBackupBar();
    showStorageStatus();
  }

  let persisted = null;
  async function showStorageStatus() {
    $('optDailyFile').checked = !!opts.dailyFile;
    $('optAutoAdd').checked = !!opts.autoAdd;
    const last = localStorage.getItem('fnfc_lastFile') || t('noch keine');
    $('storageStatus').innerHTML =
      (persisted ? '✔ ' + t('Daten dauerhaft gespeichert (Android löscht sie nicht bei Speichermangel).')
                 : '⚠ ' + t('Speicher nicht als dauerhaft markiert – App über „Installieren“ hinzufügen.')) +
      '<br>' + t('Letzte Sicherungsdatei: {d} · {n} Spule(n) im Inventar', { d: esc(last), n: spools.length });
  }

  async function initStorage() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        persisted = await navigator.storage.persisted() || await navigator.storage.persist();
      }
    } catch (e) { persisted = false; }
    showStorageStatus();
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const HELP = {
    de: `
      <div class="card"><h4>Filament NFC – Kurzanleitung</h4>
        <p class="hint">Jede Spule bekommt einen NFC-Tag (NTAG215). Darauf stehen Hersteller, Material, Farbe, Temperaturen, Restgewicht und deine Einstellungen für bis zu fünf Drucker. Wer den Tag mit dem Handy liest, sieht diese Daten – auch ohne diese App.</p></div>

          <li><b>„Web NFC nicht verfügbar“:</b> Nur Chrome auf Android kann NFC im Browser. App über das installierte Icon starten.</li>
          <li><b>Tag wird nicht erkannt:</b> NFC eingeschaltet? Handy langsam über die Rückseite bewegen, Hülle mit Metall entfernen.</li>
          <li><b>Schreibfehler:</b> Tag eventuell schreibgeschützt oder zu klein (NTAG213).</li>
          <li><b>Neue Version:</b> Die App aktualisiert sich beim Start mit Internet von selbst; ggf. zweimal öffnen.</li>
        </ul></details>`,
    en: `
      <div class="card"><h4>Filament NFC – Quick guide</h4>
        <p class="hint">Each spool gets an NFC tag (NTAG215). It stores brand, material, colour, temperatures, remaining weight and your settings for up to five printers. Anyone reading the tag with a phone sees this data – even without this app.</p></div>
      <details class="card" open><summary>1. Setup (once)</summary>
        <ol>
          <li><b>Settings → Printers:</b> add your printers. The <b>code</b> (max. 4 characters, e.g. <code>PCO</code>) is stored on the tag. The <b>firmware</b> decides the pressure advance command in the PrusaSlicer export.</li>
          <li><b>Colours, brands, materials</b> are only suggestions for input. New entries are also added automatically when you save a spool.</li>
          <li>Turn on NFC on your phone (Settings → Connections → NFC).</li>
        </ol></details>
      <details class="card"><summary>2. Create and write a new spool</summary>
        <ol>
          <li>Tap <b>Spool → New spool</b>. The app assigns a 4-character ID.</li>
          <li>Enter brand, material (e.g. “PLA CF” = type PLA, variant CF), colour and temperature range.</li>
          <li>Under <b>Printer profiles</b>, add a profile for each printer and enter your calibrated values.</li>
          <li>Tap <b>Write to NFC tag</b>, then hold the phone to the tag (middle of the back) until “✔ Written to tag” appears.</li>
        </ol>
        <p class="hint">“Tag usage” shows how full the tag gets. If it is too full, the app won't write.</p></details>
      <details class="card"><summary>3. Read a spool</summary>
        <p>Tap <b>Read NFC tag</b> and hold the phone to the spool. The scanner stays active, so you can read several spools in a row. Unknown spools are added to the inventory automatically (can be turned off in Settings). Foreign OpenSpool tags are recognised too.</p></details>
      <details class="card"><summary>4. Update remaining weight</summary>
        <ol><li>Read the spool.</li><li>Put it on a kitchen scale and enter the value under <b>Scale gross</b> – net weight is calculated from the empty spool weight.</li><li>Write to NFC tag.</li></ol></details>
      <details class="card"><summary>5. Export a slicer profile</summary>
        <p>Each printer card has <b>PrusaSlicer</b> and <b>Orca</b> buttons. The file is saved to “Downloads”.</p>
        <ul>
          <li><b>PrusaSlicer:</b> File → Import → Import Config Bundle. A separate filament profile is created.</li>
          <li><b>OrcaSlicer:</b> File → Import → Import Configs.</li>
        </ul>
        <p class="hint">Exported: temperature, bed, flow, pressure advance, max volumetric speed and retraction. Cooling etc. get default values – check after the first import.</p></details>
      <details class="card"><summary>6. What is stored on the tag?</summary>
        <p>A JSON record in the open <b>OpenSpool</b> format (brand, type, color_hex, min_temp …) that other apps and printers can read, plus your extra data. Each printer profile is one short, readable line:</p>
        <p><code>"PCO":"T215 B55 F0.98 PA0.04 MF15 R0.8/35"</code></p>
        <ul class="hint">
          <li><b>T</b> nozzle °C · <b>B</b> bed °C (missing = spool value) · <b>F</b> flow</li>
          <li><b>PA</b> pressure advance · <b>MF</b> max volumetric speed mm³/s</li>
          <li><b>R</b> retraction length mm / speed mm/s</li>
        </ul>
        <p class="hint">NTAG215 fits 5 printer profiles, NTAG216 many more.</p></details>
      <details class="card"><summary>7. Backup</summary>
        <ul>
          <li>Data is stored inside the app on your phone.</li>
          <li>If there are changes and the last backup file is older than 7 days, the <b>Settings</b> tab shows a yellow dot and a notice under Backup. <b>Back up now</b> saves the file to “Downloads”. Available any time via <b>Settings → Export backup</b>.</li>
          <li>Restore: <b>Settings → Import backup</b> – or simply scan all spools, as all important data is on the tags.</li>
        </ul></details>
      <details class="card"><summary>8. Problems?</summary>
        <ul>
          <li><b>“Web NFC not available”:</b> only Chrome on Android supports NFC in the browser. Start the app via the installed icon.</li>
          <li><b>Tag not detected:</b> is NFC on? Move the phone slowly across the back, remove cases with metal.</li>
          <li><b>Write error:</b> the tag may be write-protected or too small (NTAG213).</li>
          <li><b>New version:</b> the app updates itself when started with internet; open it twice if needed.</li>
        </ul></details>`
  };
  function renderHelp() { $('helpContent').innerHTML = HELP[LANG] || HELP.en; }

  translateNode(document.body);
  if (LANG !== 'de') new MutationObserver(muts => {
    for (const m of muts) for (const n of m.addedNodes) translateNode(n);
  }).observe(document.body, { childList: true, subtree: true });
  try { $('selLang').value = localStorage.getItem('fnfc_lang') || 'auto'; } catch (e) {}
  renderHelp();

  initApp();
  initStorage();
  initBackup().then(showBackupBar);
</script>
