  };

  // Active language, decided once at startup. The construct (() => { … })()
  // defines an anonymous function and calls it immediately – a way to compute
  // a constant with several statements. Order: saved choice -> phone language
  // -> English if we have no dictionary for that language.
  const LANG = (() => {
    let l = 'auto';
    try { l = localStorage.getItem('fnfc_lang') || 'auto'; } catch (e) {}
    if (l === 'auto') l = (navigator.language || 'de').slice(0, 2).toLowerCase();
    return (l === 'de' || I18N[l]) ? l : 'en';
  })();
  document.documentElement.lang = LANG;

  // t = "translate". Look up the German key in the active dictionary, then
  // replace {name} placeholders with params.name. The regular expression
  // /\{(\w+)\}/g means: "{", one or more word characters (captured), "}",
  // g = all occurrences.
  function t(key, params) {
    let s = (LANG !== 'de' && I18N[LANG] && I18N[LANG][key]) || key;
    if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] ?? m));
    return s;
  }

  // Translate fixed texts on screen. The page is a tree of nodes (the DOM =
  // Document Object Model): elements like <div>, and text nodes inside them.
  // A TreeWalker visits every text node below `root`, like a recursive tree
  // traversal. Placeholder/title attributes are handled separately.
  // At startup this runs once for the whole page; afterwards a
  // MutationObserver (see end of script) calls it for every element that
  // the script inserts later via innerHTML.
  function translateNode(root) {
    if (LANG === 'de') return;
    const dict = I18N[LANG] || {};
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walk.nextNode()) nodes.push(walk.currentNode);
    if (root.nodeType === 3) nodes.push(root);
    for (const n of nodes) {
      const raw = n.nodeValue, key = raw.trim();
      if (key && dict[key]) n.nodeValue = raw.replace(key, dict[key]);
    }
    if (root.querySelectorAll) {
      for (const el of [root, ...root.querySelectorAll('[placeholder],[title]')]) {
        for (const a of ['placeholder', 'title']) {
          const v = el.getAttribute && el.getAttribute(a);
          if (v && dict[v]) el.setAttribute(a, dict[v]);
        }
      }
    }
  }
  // Save the choice and reload the page – simplest way to rebuild everything in the new language.
  function setLang(l) { try { localStorage.setItem('fnfc_lang', l); } catch (e) {} location.reload(); }

  // ===================================================================
  // DEFAULT MASTER DATA
  // -------------------------------------------------------------------
  // Used only on first start (or for missing parts). After that the user's
  // own copy in localStorage ("settings") is authoritative.
  // vendors/materials: suggestion lists for the input fields.
  // colors:  name -> hex colour value "#RRGGBB".
  // printers: code -> { name, fw }. The code is what ends up on the tag;
  //           fw = firmware family, selects the pressure advance G-code in
  //           the PrusaSlicer export (see exportProfile).
  // ===================================================================
  const DEFAULT_SETTINGS = {
    vendors: ["Polymaker", "Prusament", "Sunlu", "eSun", "Bambu Lab", "Elegoo"],
    materials: ["PLA", "PLA CF", "PLA Silk", "PETG", "PETG CF", "ABS", "ASA", "TPU", "PA CF", "PC"],
    colors: { "Schwarz": "#1A1A1A", "Weiß": "#F5F5F5", "Grau": "#8A8A8A", "Rot": "#C62828", "Blau": "#1565C0", "Grün": "#2E7D32", "Gelb": "#F9D71C", "Orange": "#EF6C00", "Natur": "#E8E0C8" },
    printers: {
      "PCO": { name: "Prusa CoreOne", fw: "prusa" },
      "SU1": { name: "Snapmaker U1",  fw: "klipper" },
      "V0":  { name: "Voron 0",       fw: "klipper" },
      "PMI": { name: "Prusa Mini",    fw: "prusa" }
    }
  };
  const FW_LABELS = { prusa: "Prusa (M572)", klipper: "Klipper (SET_PRESSURE_ADVANCE)", marlin: "Marlin (M900)" };
  // Starting values for a new printer profile on a spool (field names as on the tag).
  const DEFAULT_PROFILE = { t: 215, f: 1.0, pa: 0.0, mf: 12, rd: 0.8, rs: 35 };
  // Table driving the printer card input fields: [field, label, step of the number input].
  // One table instead of seven hand-written input fields – add a row here to add a field.
  const PROFILE_FIELDS = [
    ['t', 'Düse °C', '1'], ['b', 'Bett °C', '1'], ['f', 'Flow', '0.01'],
    ['pa', 'PA', '0.001'], ['mf', 'Max mm³/s', '0.5'], ['rd', 'Retr. mm', '0.1'], ['rs', 'Retr. mm/s', '1']
  ];

  // ---------------- Small helper functions ----------------
  // Read a value from localStorage. Storage only holds strings, so objects
  // are saved as JSON text and parsed back here. try/catch = if anything
  // goes wrong (missing key, corrupt text), return the fallback instead of
  // crashing. "??" means: use the right side if the left is null/undefined.
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch (e) { return fallback; }
  }
  // Deep copy of an object (record) via JSON round trip. Needed because assigning
  // an object only copies a reference (pointer), not the data.
  const clone = o => JSON.parse(JSON.stringify(o));
  // Shorthand: $('numBed') returns the HTML element with id="numBed".
  const $ = id => document.getElementById(id);
  // Escape text before inserting it into HTML. Otherwise a name like
  // "<b>" or O'Brien would be interpreted as markup / break our onclick strings.
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  // Parse a number from an input field; accepts a German decimal comma; empty -> fallback.
  function num(v, fallback = 0) {
    const n = parseFloat(String(v ?? "").replace(',', '.'));
    return isNaN(n) ? fallback : n;
  }
  // Length of a string in BYTES (UTF-8), not characters: 'ä' or '°' take 2 bytes on the tag.
  const utf8Len = s => new TextEncoder().encode(s).length;


  // ---------------- Load persistent state at startup ----------------
  // English installs start with English colour names.
  if (LANG !== 'de') DEFAULT_SETTINGS.colors = { "Black": "#1A1A1A", "White": "#F5F5F5", "Grey": "#8A8A8A", "Red": "#C62828", "Blue": "#1565C0", "Green": "#2E7D32", "Yellow": "#F9D71C", "Orange": "#EF6C00", "Natural": "#E8E0C8" };
  // settings = master data. Missing sections (e.g. after an app update) are filled from the defaults.
  let settings = loadJSON('fnfc_settings', null) || clone(DEFAULT_SETTINGS);
  for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
  if (!settings.emptyWeights || typeof settings.emptyWeights !== 'object') settings.emptyWeights = {};
  // Repair: predefined colours without a valid hex value get the default value back.
  for (const n in settings.colors) {
    if (!/^#[0-9a-f]{6}$/i.test(String(settings.colors[n] || '')) && DEFAULT_SETTINGS.colors[n]) settings.colors[n] = DEFAULT_SETTINGS.colors[n];
  }
  // spools = the inventory: an array of spool records (same structure as `cur`).
  let spools = loadJSON('fnfc_spools', []);
  if (!Array.isArray(spools)) spools = [];

  // Used only when importing a backup file: merge entries with the same spool ID.
  // A Map is a dictionary keyed by ID; for duplicates the entry with the later
  // "updated" timestamp wins (ISO date strings compare correctly as text).
  function dedupeSpools(list) {
    const byId = new Map();
    for (const s of list) {
      if (!s || !s.id) continue;
      const old = byId.get(s.id);
      if (!old || String(s.updated || '') >= String(old.updated || '')) byId.set(s.id, s);
    }
    return [...byId.values()];
  }
  // Write master data / inventory back to phone storage. Called after every change.
  // journal() additionally reports the change to the optional Termux backup server.
  const saveSettings = () => { localStorage.setItem('fnfc_settings', JSON.stringify(settings)); journal({ op: 'settings', data: settings }); };
  const saveSpools = () => localStorage.setItem('fnfc_spools', JSON.stringify(spools));

  // ---------------- Data model of one spool ----------------
  // Inside the app a spool is this record (readable field names). Only when
  // writing to a tag is it converted to the compact tag format (toTagJSON),
  // and back when reading (fromTagJSON). Fields:
  //   id        4-char ID          brand, material, cn (colour name), hex (#RRGGBB)
  //   abr       1 = abrasive       tmin/tmax nozzle range °C, bed °C
  //   ew        empty spool g      r remaining net g
  //   nw        nominal size g (250/500/…) – phone only, NOT on the tag
  //   cfg       { printerCode: { t, b, f, pa, mf, rd, rs } }
  //   updated   ISO timestamp of last save (inventory only)
  function emptySpool() {
    return { id: "", brand: "", material: "", cn: "", hex: "#000000", abr: 0,
             tmin: 0, tmax: 0, bed: 0, ew: 0, r: 0, nw: 0, cfg: {} };
  }
  // cur = the spool currently shown in the form (the "work record").
  let cur = emptySpool();

  // OpenSpool separates base material and variant. We keep one text field:
  // first word = type (upper case), rest = subtype.  "PLA CF" -> PLA + CF"
  function splitMaterial(m) {
    const parts = String(m).trim().split(/\s+/);
    return { type: (parts.shift() || "").toUpperCase(), subtype: parts.join(" ") };
  }

  // Spool record -> object in tag format (OpenSpool fields + our extras).
  // Optional fields are only added when set – every byte counts on the tag.
  // Temperatures are written as strings ("210") as in the OpenSpool examples.
  function toTagJSON(s) {
    const { type, subtype } = splitMaterial(s.material);
    const o = { protocol: "openspool", version: "1.0", brand: s.brand || "Generic", type: type || "PLA" };
    if (subtype) o.subtype = subtype;
    o.color_hex = (s.hex || "#000000").toUpperCase();
    if (s.tmin) o.min_temp = String(s.tmin);
    if (s.tmax) o.max_temp = String(s.tmax);
    if (s.bed) { o.bed_min_temp = s.bed; o.bed_max_temp = s.bed; }
    o.id = s.id;
    if (s.abr) o.abr = 1;
    o.ew = s.ew; o.r = s.r;
    o.cfg = {};
    for (const code in s.cfg) o.cfg[code] = profileToString(s.cfg[code]);
    return o;
  }

  // Printer profile record -> compact text line "T215 B55 F0.98 PA0.04 MF15 R0.8/35".
  // B (bed) only if the profile overrides the spool's bed temperature.
  function profileToString(p) {
    const parts = [`T${p.t}`];
    if (p.b !== undefined && p.b !== null && p.b !== '') parts.push(`B${p.b}`);
    parts.push(`F${p.f}`, `PA${p.pa}`, `MF${p.mf}`, `R${p.rd}/${p.rs}`);
    return parts.join(' ');
  }

  // Text line -> printer profile record (inverse of profileToString).
  // Split at spaces into tokens; each token = letter code + value. The regex
  // ^(PA|MF|T|B|F|R)(.+)$ checks the two-letter codes first so "PA0.04" is
  // not mistaken for "P…". Unknown tokens are ignored, missing values come
  // from DEFAULT_PROFILE. Old tags with a nested object are accepted too.
  function profileFromString(v) {
    if (v && typeof v === 'object') return clone(v);
    const p = {};
    for (const tok of String(v).trim().split(/\s+/)) {
      const m = tok.match(/^(PA|MF|T|B|F|R)(.+)$/i);
      if (!m) continue;
      const key = m[1].toUpperCase(), val = m[2];
      if (key === 'R') { const [rd, rs] = val.split('/'); p.rd = num(rd); if (rs !== undefined) p.rs = num(rs); }
      else p[{ T: 't', B: 'b', F: 'f', PA: 'pa', MF: 'mf' }[key]] = num(val);
    }
    return Object.assign(clone(DEFAULT_PROFILE), p);
  }

  // Tag object -> spool record. Works for our own tags and for foreign
  // OpenSpool tags (which simply lack id/cfg/ew/r). Values are passed through
  // num() because other writers may store numbers as strings or vice versa.
  function fromTagJSON(o) {
    const s = emptySpool();
    s.id = o.id || "";
    s.brand = o.brand || "";
    s.material = [o.type, o.subtype].filter(Boolean).join(" ");
    let hex = String(o.color_hex || "000000").replace('#', '');
    s.hex = /^[0-9a-f]{6}/i.test(hex) ? '#' + hex.slice(0, 6).toUpperCase() : "#000000";
    // The colour name is not stored on the tag (saves bytes); look it up by hex value.
    s.cn = o.cn || colorNameForHex(s.hex);
    s.abr = o.abr ? 1 : 0;
    s.tmin = num(o.min_temp); s.tmax = num(o.max_temp);
    s.bed = num(o.bed_max_temp ?? o.bed_min_temp);
    s.ew = num(o.ew); s.r = num(o.r);
    s.cfg = {};
    if (o.cfg && typeof o.cfg === 'object') for (const code in o.cfg) s.cfg[code] = profileFromString(o.cfg[code]);
    return s;
  }

  // Reverse lookup in the colour list: hex value -> name ("" if unknown).
  function colorNameForHex(hex) {
    const h = String(hex).toUpperCase();
    return Object.keys(settings.colors).find(n => String(settings.colors[n]).toUpperCase() === h) || "";
  }

  // One-line plain text for the optional second NDEF record – readable with any NFC app.
  function summaryText(s) {
    const parts = [`${s.brand || '?'} ${s.material || '?'}${s.cn ? ' ' + s.cn : ''}`];
    if (s.tmin || s.tmax) parts.push(`${s.tmin || '?'}-${s.tmax || '?'}°C`);
    if (s.bed) parts.push(`Bett ${s.bed}°C`);
    if (s.abr) parts.push('abrasiv');
    return parts.join(' | ');
  }

  // Exact number of bytes the NDEF message will occupy on the tag.
  // Each record: 1 header byte + 1 type-length byte + payload length
  // (1 byte if < 256 = "short record", else 4) + type + payload.
  // The whole message is wrapped in a TLV block (Tag 0x03, Length 1 or 3
  // bytes, Value) plus a terminator byte 0xFE. Same idea as a length-prefixed
  // record in a binary file.
  function ndefSize(jsonStr, text) {
    const rec = (typeLen, payloadLen) => 2 + (payloadLen < 256 ? 1 : 4) + typeLen + payloadLen;
    let msg = rec(16, utf8Len(jsonStr));              // type "application/json" = 16 bytes
    if (text) msg += rec(1, 3 + utf8Len(text));        // type "T"; payload = status byte + "en" + text
    return msg + (msg < 255 ? 2 : 4) + 1;
  }

  // ---------------- User interface ----------------
  // Status output. Shown in the grey box at the top of the spool tab AND as
  // a pop-up at the bottom, so the result is visible without scrolling.
  // sticky = stays until the next message (e.g. "hold phone to tag…");
  // otherwise a timer (setTimeout = "call this function in N ms") hides it.
  let toastTimer = null;
  function updateLog(msg, isError = false, sticky = false) {
    $('log').innerText = msg;
    $('log').style.borderLeftColor = isError ? 'var(--danger)' : 'var(--primary)';
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show ' + (isError ? 'err' : msg.startsWith('✔') ? 'ok' : '');
    clearTimeout(toastTimer);
    if (!sticky) toastTimer = setTimeout(hideToast, isError ? 7000 : 4000);
    // Haptic feedback: vibrate pattern in ms (on, off, on). Silently ignored if unsupported.
    try { if (isError) navigator.vibrate([90, 60, 90]); else if (msg.startsWith('✔')) navigator.vibrate(80); } catch (e) {}
  }
  function hideToast() { $('toast').classList.remove('show'); }

  // Show one tab, hide the others: remove class "active" everywhere, set it on
  // the chosen tab + button (the CSS shows only .tab-content.active).
  // Some tabs are redrawn on entry so they show current data.
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    $(tabId).classList.add('active');
    if (btn) btn.classList.add('active');
    if (tabId === 'inventory') renderInventory();
    if (tabId === 'settings') { renderSettings(); showStorageStatus(); }
    window.scrollTo(0, 0);
  }

  // Draw everything once. Called at startup and after importing a backup.
  function initApp() {
    refreshLists();
    renderSettings();
    renderForm();
    renderInventory();
  }

  // Fill the <datalist> suggestion lists from the master data.
  function refreshLists() {
    $('dlVendors').innerHTML = settings.vendors.map(v => `<option value="${esc(v)}">`).join('');
    $('dlMaterials').innerHTML = settings.materials.map(v => `<option value="${esc(v)}">`).join('');
    $('dlColors').innerHTML = Object.keys(settings.colors).map(v => `<option value="${esc(v)}">`).join('');
    updateAddPrinterDropdown();
  }

  // A known colour name was typed/chosen -> set the colour picker to its hex value.
  function colorNameChanged() {
    const hex = settings.colors[$('inColorName').value.trim()];
    if (hex) $('inColorHex').value = hex;
    updateSizeInfo();
  }

  // New random 4-character spool ID (a–z, 0–9 = 36^4 ≈ 1.7 million combinations).
  // do…while = Pascal's REPEAT…UNTIL: draw again while the ID already exists
  // in the inventory. This is the only place where uniqueness is enforced.
  function generateID() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let id;
    do { id = Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); }
    while (spools.some(s => s.id === id));
    return id;
  }

  // "New spool" button: empty record with fresh ID and sensible defaults.
  // The last used spool size is preselected (you mostly use 0.25/0.5 kg).
  function createNewSpool() {
    cur = emptySpool();
    cur.id = generateID();
    cur.nw = parseInt(localStorage.getItem('fnfc_lastSize')) || 1000;
    cur.r = cur.nw; cur.tmin = 200; cur.tmax = 230; cur.bed = 60;
    $('numScaleWt').value = "";
    renderForm();
    $('numEmptyWt').dataset.auto = '1';   // empty weight may be filled by a suggestion
    applyEWSuggestion();
    updateLog(t("Neue Spule angelegt. Werte ausfüllen, dann speichern."));
  }

  // "Load demo": a complete example spool, for testing without NFC (e.g. on the Mac).
  function loadDemoTag() {
    cur = fromTagJSON({
      protocol: "openspool", version: "1.0", brand: "Polymaker", type: "PLA", subtype: "CF",
      color_hex: "#1A1A1A", min_temp: "210", max_temp: "230", bed_min_temp: 60, bed_max_temp: 60,
      id: "x7b9", abr: 1, ew: 250, r: 685,
      cfg: { "PCO": { t: 215, f: 0.98, pa: 0.04, mf: 15, rd: 0.8, rs: 35 },
             "SU1": { t: 220, b: 55, f: 1.0, pa: 0.06, mf: 12, rd: 1.2, rs: 40 } }
    });
    $('numScaleWt').value = "";
    renderForm();
    updateLog(t("Demo-Spule geladen (ohne NFC)."));
  }

  // ---------------- Empty spool weight suggestion ----------------
  // Priority:
  //   1. fixed value from Settings → Brands (settings.emptyWeights[brand][size])
  //   2. learned: the most frequent ew of your other spools with the same
  //      brand and size (a frequency table, then pick the maximum)
  // Returns null if nothing is known, else { g, src, n }.
  function suggestEW(brand, size) {
    if (!brand || !size) return null;
    const manual = settings.emptyWeights[brand] && settings.emptyWeights[brand][size];
    if (manual) return { g: manual, src: 'manual' };
    const vals = spools.filter(s => s.brand === brand && s.nw === size && s.ew > 0 && s.id !== cur.id).map(s => s.ew);
    if (!vals.length) return null;
    const freq = {};
    vals.forEach(v => freq[v] = (freq[v] || 0) + 1);
    const g = +Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
    return { g, src: 'learned', n: vals.length };
  }

  // 500 -> "0,5 kg" (German) / "0.5 kg" (English).
  function sizeLabel(size) { return (size / 1000).toLocaleString(LANG === 'de' ? 'de-DE' : 'en-US') + ' kg'; }

  // Put the suggestion into the empty-weight field. Called only when brand or
  // spool size changes – never while typing in the weight field itself, so
  // the value can be deleted freely. The field's data-auto flag ("1" = value
  // came from a suggestion, "0" = typed by the user) prevents overwriting
  // user input.
  function applyEWSuggestion() {
    const brand = $('inVendor').value.trim(), size = parseInt($('selSize').value);
    const sug = suggestEW(brand, size), field = $('numEmptyWt'), hint = $('ewHint');
    if (!sug) { hint.textContent = brand ? t('Kein Leergewicht für {b} {s} bekannt.', { b: brand, s: sizeLabel(size) }) : ''; return; }
    if (field.dataset.auto === '1' || field.value === '') {
      field.value = sug.g; field.dataset.auto = '1';
      calcNetWeight(); updateSizeInfo();
    }
    hint.textContent = sug.src === 'manual'
      ? t('Leergewicht {b} {s}: {g} g (Verwaltung)', { b: brand, s: sizeLabel(size), g: sug.g })
      : t('Leergewicht {b} {s}: {g} g (gelernt aus {n} Spule(n))', { b: brand, s: sizeLabel(size), g: sug.g, n: sug.n });
  }

  // cur -> input fields ("display the record"). The inverse is collectForm().
  function renderForm() {
    $('tagId').value = cur.id;
    $('inVendor').value = cur.brand;
    $('inMaterial').value = cur.material;
    $('inColorName').value = cur.cn;
    $('inColorHex').value = cur.hex || "#000000";
    $('chkAbrasive').checked = !!cur.abr;
    $('numTmin').value = cur.tmin || "";
    $('numTmax').value = cur.tmax || "";
    $('numBed').value = cur.bed || "";
    $('numEmptyWt').value = cur.ew || "";
    $('numEmptyWt').dataset.auto = '0';   // never auto-overwrite a loaded value
    $('selSize').value = String(cur.nw || 1000);
    $('numNetWt').value = cur.r || "";
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  // Input fields -> cur ("read the record back from the screen").
  function collectForm() {
    cur.brand = $('inVendor').value.trim();
    cur.material = $('inMaterial').value.trim();
    cur.cn = $('inColorName').value.trim();
    cur.hex = $('inColorHex').value;
    cur.abr = $('chkAbrasive').checked ? 1 : 0;
    cur.tmin = num($('numTmin').value);
    cur.tmax = num($('numTmax').value);
    cur.bed = num($('numBed').value);
    cur.ew = num($('numEmptyWt').value);
    cur.nw = parseInt($('selSize').value) || 0;
    cur.r = Math.round(num($('numNetWt').value));
  }

  // Net = scale reading - empty spool weight, never below 0.
  function calcNetWeight() {
    const scale = parseFloat($('numScaleWt').value);
    if (!isNaN(scale)) $('numNetWt').value = Math.max(0, Math.round(scale - num($('numEmptyWt').value)));
  }

  // Live display "Tag usage: n / 504 bytes". Runs on every keystroke in the spool tab.
  function updateSizeInfo() {
    if (!cur.id) { $('sizeInfo').textContent = ""; return; }
    collectForm();
    const json = JSON.stringify(toTagJSON(cur));
    const withSum = $('chkSummary').checked;
    const size = ndefSize(json, withSum ? summaryText(cur) : null);
    const cap = parseInt($('tagType').value);
    $('sizeInfo').textContent = t('Tag-Belegung: {size} / {cap} Bytes', { size, cap }) + (size > cap ? '  ⚠ ' + t('zu groß') : '');
    $('sizeInfo').style.color = size > cap ? 'var(--danger)' : 'var(--muted)';
  }

  // ---------------- Printer profiles on the current spool ----------------
  // cur.cfg is a dictionary printerCode -> profile record.
  // "Add profile" dropdown: only printers that have no profile on this spool yet.
  function updateAddPrinterDropdown() {
    $('selAddPrinter').innerHTML = Object.entries(settings.printers)
      .filter(([code]) => !cur.cfg[code])
      .map(([code, p]) => `<option value="${esc(code)}">${esc(p.name)} (${esc(code)})</option>`).join('');
  }

  function addPrinterProfile() {
    if (!cur.id) { updateLog(t("Erst eine Spule lesen oder neu anlegen."), true); return; }
    const code = $('selAddPrinter').value;
    if (!code) return;
    const p = clone(DEFAULT_PROFILE);
    if (cur.tmin && cur.tmax) p.t = Math.round((cur.tmin + cur.tmax) / 2);
    cur.cfg[code] = p;
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  function removePrinterProfile(code) {
    if (!confirm(t('Profil {code} von dieser Spule entfernen?', { code }))) return;
    delete cur.cfg[code];
    updateAddPrinterDropdown();
    renderPrinterCards();
    updateSizeInfo();
  }

  // Called by every input in a printer card (oninput). An empty bed field
  // deletes B, so the spool's bed temperature applies again.
  function setProfileValue(code, field, value) {
    if (!cur.cfg[code]) return;
    if (field === 'b' && String(value).trim() === '') delete cur.cfg[code].b;
    else cur.cfg[code][field] = num(value);
    updateSizeInfo();
  }

  // Build the printer cards as an HTML string and insert it in one go via
  // innerHTML. .map() turns each element of an array into a string,
  // .join('') concatenates them – a loop that produces text.
  function renderPrinterCards() {
    const codes = Object.keys(cur.cfg);
    if (!codes.length) { $('printerProfilesContainer').innerHTML = `<p class='hint'>${t('Noch keine Profile auf dieser Spule.')}</p>`; return; }
    $('printerProfilesContainer').innerHTML = codes.map(code => {
      const p = cur.cfg[code], c = esc(code);
      const name = settings.printers[code] ? settings.printers[code].name : code + ' (' + t('unbekannt') + ')';
      return `
        <div class="printer-profile">
          <div class="printer-header">
            <strong>${esc(name)}</strong>
            <div class="row">
              <button class="btn-secondary btn-small" onclick="exportProfile('${c}','prusa')">PrusaSlicer</button>
              <button class="btn-secondary btn-small" onclick="exportProfile('${c}','orca')">Orca</button>
              <button class="btn-danger btn-small" onclick="removePrinterProfile('${c}')">✕</button>
            </div>
          </div>
          <div class="grid-4">
            ${PROFILE_FIELDS.map(([k, label, step]) => `
              <div><label>${t(label)}</label><input type="number" inputmode="decimal" step="${step}" value="${esc(p[k] ?? '')}"
                oninput="setProfileValue('${c}','${k}',this.value)"></div>`).join('')}
          </div>
          <p class="hint" style="margin:0; font-size:11px;">${t('Bett leer = globaler Wert. PA = Pressure/Linear Advance.')}</p>
        </div>`;
    }).join('');
  }

  // ---------------- Saving ----------------
  // Copy cur into the inventory: replace the entry with the same ID, or append.
  function storeLocal() {
    collectForm();
    if (cur.nw) localStorage.setItem('fnfc_lastSize', String(cur.nw));
    const entry = clone(cur);
    entry.updated = new Date().toISOString();
    const i = spools.findIndex(s => s.id === cur.id);
    if (i >= 0) spools[i] = entry; else spools.push(entry);
    saveSpools();
    journal({ op: 'spool', data: entry });
    learnSuggestions();
    dailyFileBackup();
  }

  // New brands/materials/colours used on a spool are added to the suggestion lists.
  function learnSuggestions() {
    let changed = false;
    if (cur.brand && !settings.vendors.includes(cur.brand)) { settings.vendors.push(cur.brand); changed = true; }
    if (cur.material && !settings.materials.includes(cur.material)) { settings.materials.push(cur.material); changed = true; }
    if (cur.cn && !isHex(settings.colors[cur.cn])) { settings.colors[cur.cn] = cur.hex.toUpperCase(); changed = true; }
    if (changed) { saveSettings(); refreshLists(); renderSettings(); }
  }

  // Minimum requirements before saving: a spool is loaded, brand and material are set.
  function validate() {
    if (!cur.id) { updateLog(t("Keine Spule geladen. Tag lesen oder 'Neue Spule'."), true); return false; }
    collectForm();
    if (!cur.brand || !cur.material) { updateLog(t("Bitte mindestens Hersteller und Material angeben."), true); return false; }
    return true;
  }

  // "Save locally only": inventory update, tag untouched.
  function saveLocalOnly() {
    if (!validate()) return;
    storeLocal();
    updateLog(t('Spule {id} lokal gespeichert (Tag nicht verändert).', { id: cur.id }));
  }

  // "Write to NFC tag". Order of events:
  //   1. build the tag object, check it fits (size check before touching the tag)
  //   2. hand the records to Web NFC; the browser waits until a tag is near
  //   3. only on success update the inventory, so it always mirrors the tag.
  // "await" suspends here until the write finished or failed (-> catch).
  async function saveToTag() {
    if (!validate()) return;
    const json = JSON.stringify(toTagJSON(cur));
    const text = $('chkSummary').checked ? summaryText(cur) : null;
    const size = ndefSize(json, text);
    const cap = parseInt($('tagType').value);
    if (size > cap) {
      updateLog(t('Zu groß für den Tag ({size}/{cap} Bytes). Zusammenfassung abwählen oder Profile reduzieren.', { size, cap }), true);
      return;
    }
    if (!("NDEFReader" in window)) { updateLog(t("Web NFC nicht verfügbar – Chrome auf Android über https:// oder localhost nötig."), true); return; }

    const records = [{ recordType: "mime", mediaType: "application/json", data: new TextEncoder().encode(json) }];
    if (text) records.push({ recordType: "text", lang: "en", data: text });
    updateLog(t('Jetzt Handy an den Tag halten… ({size}/{cap} Bytes)', { size, cap }), false, true);
    try {
      await (nfcReader || new NDEFReader()).write({ records });
      // Write succeeded -> bring the inventory entry in line with the tag.
      storeLocal();
      updateLog('✔ ' + t('Auf Tag geschrieben ({size}/{cap} Bytes).', { size, cap }));
    } catch (err) {
      updateLog(t('NFC-Schreibfehler: {err}', { err: err.message || err }), true);
    }
  }

  // ---------------- Reading NFC ----------------
  // Web NFC: NDEFReader is the browser's NFC interface (Chrome on Android
  // only, and only on https:// or localhost). One reader object for the whole
  // session; scan() starts listening, afterwards the browser calls
  // onreading() for every tag that comes near – an event handler, not a poll.
  let nfcReader = null;

  // "Read NFC tag" button. Starts the scanner once; it then stays active,
  // so several spools can be read in a row.
  async function readNFC() {
    if (!("NDEFReader" in window)) { updateLog(t("Web NFC nicht verfügbar – Chrome auf Android über https:// oder localhost nötig."), true); return; }
    if (nfcReader) { updateLog(t("Scanner aktiv – Handy an die Spule halten…")); return; }
    try {
      nfcReader = new NDEFReader();
      await nfcReader.scan();
      updateLog(t("Scanner aktiv – Handy an die Spule halten…"), false, true);
      nfcReader.onreadingerror = () => updateLog(t("Tag nicht lesbar – nochmal versuchen."), true);
      nfcReader.onreading = ev => handleTag(ev.message.records);
    } catch (err) {
      nfcReader = null;
      updateLog(t("NFC-Fehler: ") + (err.message || err), true);
    }
  }

  // Called with the records of a detected tag. Looks for the first record that
  // contains JSON in our/OpenSpool format, converts it into `cur` and shows it.
  function handleTag(records) {
    let data = null;
    for (const rec of records) {
      try {
        const isJsonMime = rec.recordType === "mime" && /json/i.test(rec.mediaType || "");
        if (!isJsonMime && rec.recordType !== "text") continue;
        const txt = new TextDecoder(rec.encoding || "utf-8").decode(rec.data);
        const o = JSON.parse(txt);
        if (o && (o.protocol === "openspool" || o.cfg)) { data = o; break; }
      } catch (e) { /* not JSON – try the next record */ }
    }
    if (!data) { updateLog(t(records.length ? "Tag gelesen, aber kein Spulen-Format (OpenSpool) gefunden." : "Leerer Tag – 'Neue Spule' anlegen und schreiben."), true); return; }

    cur = fromTagJSON(data);
    // Known spool: take phone-only data (spool size, colour name) from the inventory.
    const inv = spools.find(s => s.id === cur.id);
    let note = "";
    if (inv && inv.nw) { cur.nw = inv.nw; $('selSize').value = String(inv.nw); }
    if (!cur.cn && inv && inv.hex === cur.hex) cur.cn = inv.cn || "";
    if (!cur.id) { cur.id = generateID(); note = " " + t("Fremder OpenSpool-Tag – neue ID vergeben, beim Speichern wird sie ergänzt."); }
    $('numScaleWt').value = "";
    renderForm();
    switchTab('scanner', document.querySelector('.tab-btn'));
    let known = spools.some(s => s.id === cur.id);
    // Unknown spool -> add it to the inventory right away (switchable). After a
    // data loss you can rebuild the inventory just by scanning all spools,
    // because everything important is on the tags.
    if (!known && opts.autoAdd && !note) {
      const entry = clone(cur); entry.updated = new Date().toISOString();
      spools.push(entry); saveSpools(); journal({ op: 'spool', data: entry });
      known = true; note = " " + t("Ins Inventar übernommen.");
    }
    updateLog('✔ ' + t("Spule {id} gelesen: {name}.", { id: cur.id, name: cur.brand + " " + cur.material }) + (known ? "" : " (" + t("noch nicht im Inventar") + ")") + note);
  }

  // ---------------- Inventory tab ----------------
  // Draw the inventory list. Pipeline: map each spool to {s, i} (keep the
  // original index i for the buttons), filter by material and search text,
  // sort by brand+material, then build HTML. reduce() sums up the weights.
  function renderInventory() {
    const sel = $('invFilter');
    const old = sel.value || 'all';
    const mats = [...new Set(spools.map(s => s.material).filter(Boolean))].sort();
    sel.innerHTML = `<option value="all">${t('Alle')}</option>` + mats.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    sel.value = mats.includes(old) ? old : 'all';

    const q = $('invSearch').value.trim().toLowerCase();
    const list = spools.map((s, i) => ({ s, i }))
      .filter(({ s }) => sel.value === 'all' || s.material === sel.value)
      .filter(({ s }) => !q || [s.id, s.brand, s.material, s.cn].join(' ').toLowerCase().includes(q))
      .sort((a, b) => (a.s.brand + a.s.material).localeCompare(b.s.brand + b.s.material));

    if (!list.length) { $('inventoryList').innerHTML = `<p class='hint'>${t('Keine Spulen gefunden.')}</p>`; return; }
    const total = list.reduce((sum, { s }) => sum + num(s.r), 0);
    $('inventoryList').innerHTML =
      `<p class="hint">${t('{n} Spule(n), zusammen {g} g. Antippen zum Bearbeiten.', { n: list.length, g: Math.round(total) })}</p>` +
      list.map(({ s, i }) => `
        <div class="card inventory-item">
          <div class="row" style="cursor:pointer; flex:1;" onclick="loadFromInventory(${i})">
            <span class="swatch" style="background:${esc(s.hex)}"></span>
            <div>
              <strong>${esc(s.brand)} ${esc(s.material)}${s.cn ? ' – ' + esc(s.cn) : ''}</strong>${s.abr ? ' ⚠' : ''}<br>
              <span class="hint" style="font-size:12px;">ID ${esc(s.id)} · ${t('Rest')} ${esc(s.r)} g · ${esc(Object.keys(s.cfg || {}).join(', ') || t('keine Profile'))}</span>
            </div>
          </div>
          <button class="btn-danger btn-small" onclick="deleteSpool(${i})">✕</button>
        </div>`).join('');
  }

  // Tap on an inventory entry -> copy it into cur and switch to the spool tab.
  function loadFromInventory(i) {
    if (!spools[i]) return;
    cur = Object.assign(emptySpool(), clone(spools[i]));
    delete cur.updated;
    $('numScaleWt').value = "";
    renderForm();
    switchTab('scanner', document.querySelector('.tab-btn'));
    updateLog(t('Spule {id} aus dem Inventar geladen.', { id: cur.id }));
  }

  // Remove from the inventory only; the tag itself is not touched.
  function deleteSpool(i) {
    if (!confirm(t('Spule {id} aus dem Inventar löschen? (Der Tag bleibt unverändert.)', { id: spools[i].id }))) return;
    const id = spools[i].id;
    spools.splice(i, 1);
    saveSpools();
    journal({ op: 'delete', id });
    dailyFileBackup();
    renderInventory();
  }

  // ---------------- Slicer export ----------------
  // Generates a filament profile file for one printer profile of the spool.
  // Collect everything the export needs: profile values, printer, base type, effective bed temp.
  function profileFor(code) {
    collectForm();
    const p = cur.cfg[code];
    const printer = settings.printers[code] || { name: code, fw: "klipper" };
    const { type } = splitMaterial(cur.material);
    const bed = p.b ?? cur.bed;
    const name = `${cur.brand} ${cur.material}${cur.cn ? ' ' + cur.cn : ''} @${printer.name}`;
    return { p, printer, type, bed, name };
  }

  function exportProfile(code, kind) {
    const { p, printer, type, bed, name } = profileFor(code);
    const safe = name.replace(/[^\w\-. @äöüÄÖÜß]+/g, '_');
    if (kind === 'prusa') {
      // PrusaSlicer config bundle (INI format): File > Import > Import Config Bundle.
      // The [filament:Name] section creates a separate filament preset; keys we
      // don't write get PrusaSlicer's defaults. PrusaSlicer has no pressure
      // advance setting, so the firmware command goes into start_filament_gcode.
      const paCmd = { prusa: `M572 S${p.pa}`, marlin: `M900 K${p.pa}`, klipper: `SET_PRESSURE_ADVANCE ADVANCE=${p.pa}` }[printer.fw] || '';
      const lines = [
        `# Erzeugt von Filament NFC – Spule ${cur.id}`,
        `[filament:${name}]`,
        `filament_vendor = ${cur.brand}`,
        `filament_type = ${type}`,
        `filament_colour = ${cur.hex.toUpperCase()}`,
        `temperature = ${p.t}`,
        `first_layer_temperature = ${p.t}`,
        `bed_temperature = ${bed}`,
        `first_layer_bed_temperature = ${bed}`,
        `extrusion_multiplier = ${p.f}`,
        `filament_max_volumetric_speed = ${p.mf}`,
        `filament_retract_length = ${p.rd}`,
        `filament_retract_speed = ${p.rs}`,
        `start_filament_gcode = "${p.pa ? paCmd : ''}"`,
        `filament_notes = "Spule ${cur.id}${cur.abr ? ', abrasiv' : ''}"`,
        ''
      ];
      download(`${safe}.ini`, lines.join('\n'), 'text/plain');
    } else {
      // OrcaSlicer filament preset (JSON): File > Import > Import Configs.
      // Orca stores most values as arrays of strings (one entry per extruder).
      const o = {
        type: "filament", name, from: "User", inherits: "", version: "2.3.0.0",
        filament_settings_id: [name],
        filament_vendor: [cur.brand],
        filament_type: [type],
        default_filament_colour: [cur.hex.toUpperCase()],
        nozzle_temperature: [String(p.t)],
        nozzle_temperature_initial_layer: [String(p.t)],
        nozzle_temperature_range_low: [String(cur.tmin || p.t)],
        nozzle_temperature_range_high: [String(cur.tmax || p.t)],
        hot_plate_temp: [String(bed)], hot_plate_temp_initial_layer: [String(bed)],
        textured_plate_temp: [String(bed)], textured_plate_temp_initial_layer: [String(bed)],
        filament_flow_ratio: [String(p.f)],
        enable_pressure_advance: [p.pa ? "1" : "0"],
        pressure_advance: [String(p.pa)],
        filament_max_volumetric_speed: [String(p.mf)],
        filament_retraction_length: [String(p.rd)],
        filament_retraction_speed: [String(p.rs)],
        filament_notes: `Spule ${cur.id}${cur.abr ? ', abrasiv' : ''}`,
        compatible_printers: []
      };
      download(`${safe}.json`, JSON.stringify(o, null, 4), 'application/json');
    }
    updateLog(t('Profil "{name}" exportiert (Ordner Downloads).', { name }));
  }

  // Offer a file for download: wrap the text in a Blob (in-memory file), make
  // a temporary URL for it, "click" an invisible link, then release the URL.
  // On Android the file lands in the Downloads folder.
  function download(filename, content, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type: mime }));
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ---------------- Settings tab ----------------
  // Builds the printer, colour, brand and material cards as one HTML string.
  function renderSettings() {
    const listCard = (key, title, items, render) => `
      <div class="card">
        <h4>${title}</h4>
        ${items.map(render).join('') || '<p class="hint">leer</p>'}
      </div>`;

    let html = '';
    html += `
      <div class="card">
        <h4>${t('Drucker')}</h4>
        ${Object.entries(settings.printers).map(([code, p]) => `
          <div class="list-row">
            <span><b>${esc(code)}</b> ${esc(p.name)}<br><span class="hint" style="font-size:12px;">${esc(FW_LABELS[p.fw] || p.fw)}</span></span>
            <button class="btn-danger btn-small" onclick="deletePrinter('${esc(code)}')">✕</button>
          </div>`).join('')}
        <div class="row" style="margin-top:10px; flex-wrap:wrap;">
          <input type="text" id="addPrCode" placeholder="Code" maxlength="4" style="width:70px; margin:0;">
          <input type="text" id="addPrName" placeholder="Name" style="flex:1; margin:0; min-width:120px;">
          <select id="addPrFw" style="width:auto; margin:0;">
            ${Object.entries(FW_LABELS).map(([k, l]) => `<option value="${k}">${l.split(' ')[0]}</option>`).join('')}
          </select>
          <button class="btn-primary btn-small btn-add" style="padding:10px 14px; white-space:nowrap;" onclick="addPrinter()">${t('Hinzufügen')}</button>
        </div>
        <p class="hint" style="margin-bottom:0;">${t('Der Code steht auf dem Tag (kurz halten). Die Firmware bestimmt den Pressure-Advance-Befehl im PrusaSlicer-Export.')}</p>
      </div>`;

    // Colours: each row has its own colour picker (onchange -> setColorHex).
    html += `
      <div class="card">
        <h4>${t('Farben')}</h4>
        ${Object.entries(settings.colors).map(([n, h]) => {
          const ok = isHex(h);
          return `
          <div class="list-row">
            <span class="row" style="flex:1;">
              <input type="color" value="${ok ? esc(h) : '#808080'}" style="width:44px; height:34px; margin:0;"
                onchange="setColorHex('${esc(n)}', this.value)">
              <span>${esc(n)}<br><span class="hint" style="font-size:12px; ${ok ? '' : 'color:var(--danger)'}">${ok ? esc(h.toUpperCase()) : t('kein Farbwert – antippen zum Festlegen')}</span></span>
            </span>
            <button class="btn-danger btn-small" onclick="deleteListItem('colors','${esc(n)}')">✕</button>
          </div>`;
        }).join('')}
        <label style="margin-top:10px;">${t('Neue Farbe: Farbwert wählen, Namen vergeben')}</label>
        <div class="row">
          <input type="color" id="addColHex" value="#808080" style="width:56px; height:42px; margin:0;">
          <input type="text" id="addColName" placeholder="${t('z.B. Galaxy Lila')}" style="flex:1; margin:0;">
          <button class="btn-primary btn-small btn-add" style="padding:10px 14px; white-space:nowrap;" onclick="addColor()">${t('Hinzufügen')}</button>
        </div>
      </div>`;
    const simpleCard = (key, title, ph) => `
      <div class="card">
        <h4>${t(title)}</h4>
        ${settings[key].map(v => `
          <div class="list-row"><span>${esc(v)}</span><button class="btn-danger btn-small" onclick="deleteListItem('${key}','${esc(v)}')">✕</button></div>`).join('')}
        <div class="row" style="margin-top:10px;">
          <input type="text" id="add_${key}" placeholder="${t(ph)}" style="flex:1; margin:0;">
          <button class="btn-primary btn-small btn-add" style="padding:10px 14px; white-space:nowrap;" onclick="addListItem('${key}')">${t('Hinzufügen')}</button>
        </div>
      </div>`;
    // Brands: collapsible rows with one empty-weight field per spool size.
    // Learned values appear as grey placeholder "≈ 110" (not stored, just shown).
    const SIZES = [250, 500, 750, 1000, 2000, 3000];
    html += `
      <div class="card">
        <h4>${t('Hersteller')}</h4>
        <p class="hint" style="margin-top:0;">${t('Antippen, um Leergewichte je Spulengröße festzulegen. Grau mit ≈ = aus deinen Spulen gelernt.')}</p>
        ${settings.vendors.map(v => {
          const known = SIZES.filter(sz => (settings.emptyWeights[v] || {})[sz] || suggestEW(v, sz));
          return `
          <details class="list-row" style="display:block;">
            <summary style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
              <span>${esc(v)}<span class="hint" style="font-size:12px;">${known.length ? ' · ' + known.map(sz => sizeLabel(sz)).join(', ') : ''}</span></span>
              <button class="btn-danger btn-small" onclick="event.preventDefault(); deleteListItem('vendors','${esc(v)}')">✕</button>
            </summary>
            <div class="grid-3" style="margin-top:8px;">
              ${SIZES.map(sz => {
                const m = (settings.emptyWeights[v] || {})[sz];
                const l = m ? null : suggestEW(v, sz);
                return `<div><label>${sizeLabel(sz)}</label><input type="number" inputmode="numeric" value="${m || ''}"
                  placeholder="${l ? '≈ ' + l.g : 'g'}"
                  onchange="setEmptyWeight('${esc(v)}', ${sz}, this.value)" style="margin-bottom:6px;"></div>`;
              }).join('')}
            </div>
          </details>`;
        }).join('')}
        <div class="row" style="margin-top:10px;">
          <input type="text" id="add_vendors" placeholder="${t('z.B. Extrudr')}" style="flex:1; margin:0;">
          <button class="btn-primary btn-small btn-add" style="padding:10px 14px; white-space:nowrap;" onclick="addListItem('vendors')">${t('Hinzufügen')}</button>
        </div>
      </div>`;
    html += simpleCard('materials', 'Materialien', 'z.B. PETG HF');
    html += `<p class="hint">${t('Neue Hersteller, Materialien und Farben landen außerdem automatisch in den Listen, sobald du eine Spule damit speicherst.')}</p>`;
    $('settingsSections').innerHTML = html;
  }

  // Printer codes: upper case letters/digits only – they end up on the tag and in onclick strings.
  function addPrinter() {
    const code = $('addPrCode').value.trim().toUpperCase();
    const name = $('addPrName').value.trim();
    if (!code || !name) { updateLog(t('Bitte Code und Namen des Druckers eingeben.'), true); return; }
    if (!/^[A-Z0-9]+$/.test(code)) { updateLog(t("Code nur aus Buchstaben/Ziffern."), true); return; }
    if (settings.printers[code] && !confirm(t('Code {code} existiert schon. Überschreiben?', { code }))) return;
    settings.printers[code] = { name, fw: $('addPrFw').value };
    saveSettings(); refreshLists(); renderSettings(); renderPrinterCards();
    updateLog('✔ ' + t('„{v}“ hinzugefügt.', { v: name + ' (' + code + ')' }));
  }

  // Profiles already written to spools stay there; only the printer entry is removed.
  function deletePrinter(code) {
    const used = spools.filter(s => s.cfg && s.cfg[code]).length;
    if (!confirm(used ? t('{code} wird von {n} Spule(n) verwendet. Trotzdem löschen? (Profile auf den Spulen bleiben erhalten)', { code, n: used }) : t('Drucker {code} löschen?', { code }))) return;
    delete settings.printers[code];
    saveSettings(); refreshLists(); renderSettings(); renderPrinterCards();
  }

  // true if h looks like "#RRGGBB".
  const isHex = h => /^#[0-9a-f]{6}$/i.test(String(h || ''));

  function setColorHex(name, hex) {
    settings.colors[name] = hex.toUpperCase();
    saveSettings(); refreshLists(); renderSettings();
  }

  function addColor() {
    const name = $('addColName').value.trim();
    const hex = $('addColHex').value.toUpperCase();
    if (!name) { updateLog(t("Bitte einen Namen für die Farbe eingeben."), true); return; }
    const same = colorNameForHex(hex);
    if (same && same !== name && !confirm(t('Der Farbwert {hex} heißt schon "{same}". Trotzdem zusätzlich als "{name}" anlegen?', { hex, same, name }))) return;
    if (settings.colors[name] && !confirm(t('"{name}" existiert schon ({hex}). Farbwert überschreiben?', { name, hex: settings.colors[name] }))) return;
    settings.colors[name] = hex;
    saveSettings(); refreshLists(); renderSettings();
    updateLog('✔ ' + t('„{v}“ hinzugefügt.', { v: name }));
  }

  // Store/delete a fixed empty weight for brand + size (empty field = delete).
  function setEmptyWeight(vendor, size, value) {
    const g = Math.round(num(value));
    settings.emptyWeights[vendor] = settings.emptyWeights[vendor] || {};
    if (g > 0) settings.emptyWeights[vendor][size] = g; else delete settings.emptyWeights[vendor][size];
    if (!Object.keys(settings.emptyWeights[vendor]).length) delete settings.emptyWeights[vendor];
    saveSettings();
  }

  // Add a brand/material. Gives visible feedback in every case (pop-up at the bottom).
  function addListItem(key) {
    const v = $('add_' + key).value.trim();
    if (!v) { updateLog(t('Bitte zuerst einen Namen eingeben.'), true); return; }
    if (settings[key].includes(v)) { updateLog(t('„{v}“ ist schon in der Liste.', { v }), true); return; }
    settings[key].push(v);
    settings[key].sort((a, b) => a.localeCompare(b));
    saveSettings(); refreshLists(); renderSettings();
    updateLog('✔ ' + t('„{v}“ hinzugefügt.', { v }));
  }

  // Colour picker in the spool form changed -> fill in the matching colour name if known.
  function colorHexChanged() {
    const name = colorNameForHex($('inColorHex').value);
    const curName = $('inColorName').value.trim();
    if (name && (!curName || settings.colors[curName])) $('inColorName').value = name;
    updateSizeInfo();
  }

  function deleteListItem(key, value) {
    if (key === 'colors') delete settings.colors[value];
    else settings[key] = settings[key].filter(v => v !== value);
    saveSettings(); refreshLists(); renderSettings();
  }

  // ---------------- Backup file (export / import) ----------------
  // Whole state (settings + inventory) as one JSON file in Downloads.
  function exportBackup() {
    const data = { app: "filament-nfc", version: 2, exported: new Date().toISOString(), settings, spools };
    download(`filament-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
    localStorage.setItem('fnfc_lastFile', new Date().toISOString().slice(0, 10));
    localStorage.removeItem('fnfc_dirty');
  }

  // Read a backup file chosen by the user. Replaces the current data after a
  // confirmation; duplicate IDs inside the file are merged (dedupeSpools).
  async function importBackup(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.settings || !Array.isArray(data.spools)) throw new Error(t("Keine gültige Backup-Datei"));
      if (!confirm(t('Backup vom {date} mit {n} Spule(n) importieren? Aktuelle Daten werden ersetzt.', { date: data.exported || '?', n: data.spools.length }))) return;
      settings = data.settings;
      for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
      if (!settings.emptyWeights) settings.emptyWeights = {};
      spools = dedupeSpools(data.spools);
      saveSettings(); saveSpools(); initApp();
      sendSnapshot(true);
      alert(t("Backup importiert."));
    } catch (e) { alert(t("Import fehlgeschlagen: ") + e.message); }
    finally { $('importFile').value = ""; }
  }

  // One global listener instead of one per field ("event delegation"): any
  // input inside the spool tab updates the tag-size display.
  // Enter key in an "add" field (Settings, add profile) = tap the "Add" button in the same row.
  // On the phone keyboard this is the ✓ / → key.
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    const btn = e.target.closest('.row') && e.target.closest('.row').querySelector('.btn-add');
    if (btn) { e.preventDefault(); btn.click(); }
  });
  document.addEventListener('input', e => { if (e.target.closest('#scanner') && e.target.type !== 'checkbox') updateSizeInfo(); });

  // ===================================================================
  // OPTIONAL: AUTO BACKUP VIA filament_server.py (Termux on the phone)
  // -------------------------------------------------------------------
  // Only active if the app is opened from that local server. Then every
  // change is sent as a journal entry (incremental, like a transaction
  // log), plus one full snapshot per day. If the server is unreachable,
  // entries wait in a queue (fnfc_pending) and are sent later.
  // On GitHub Pages there is no server: /api/ping fails and all of this
  // stays switched off.
  // fetch() = HTTP request from JavaScript; returns a "promise" we await.
  // ===================================================================
  let backupServer = false;
  let pending = loadJSON('fnfc_pending', []);

  // Queue one change and try to send it. Does nothing unless a server was ever seen.
  function journal(entry) {
    if (!localStorage.getItem('fnfc_serverSeen')) return;   // no Termux server in use -> don't queue anything
    entry.ts = new Date().toISOString();
    pending.push(entry);
    localStorage.setItem('fnfc_pending', JSON.stringify(pending));
    flushJournal();
  }

  // Send all queued entries in one POST; remove them from the queue only on success.
  async function flushJournal() {
    if (!backupServer || !pending.length) { showBackupStatus(); return; }
    const batch = pending.slice();
    try {
      const r = await fetch('/api/journal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(batch) });
      if (!r.ok) throw new Error(r.status);
      pending = pending.slice(batch.length);
      localStorage.setItem('fnfc_pending', JSON.stringify(pending));
    } catch (e) { /* server gone – entries stay queued */ }
    showBackupStatus();
  }

  // Full copy of the state to the server (backups/snapshot-YYYY-MM-DD.json).
  async function sendSnapshot(manual = false) {
    if (!backupServer) return;
    const data = { app: "filament-nfc", version: 2, exported: new Date().toISOString(), settings, spools };
    try {
      const r = await fetch('/api/snapshot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const res = await r.json();
      localStorage.setItem('fnfc_lastSnapshot', data.exported.slice(0, 10));
      showBackupStatus();
      if (manual) alert(t('Vollsicherung gespeichert: ') + 'backups/' + res.file);
    } catch (e) { if (manual) alert(t('Sicherung fehlgeschlagen: ') + e.message); }
  }

  function showBackupStatus() {
    const el = $('autoBackupStatus');
    if (!el) return;
    // The server is optional: only show this status line if it runs or entries are waiting.
    el.style.display = (backupServer || pending.length) ? '' : 'none';
    const last = localStorage.getItem('fnfc_lastSnapshot') || '–';
    if (backupServer) {
      el.innerHTML = '✔ ' + t('Auto-Backup aktiv · letzte Vollsicherung: {d}', { d: esc(last) }) +
        (pending.length ? ` · <span style="color:#ffc107">${t('{n} Änderung(en) warten', { n: pending.length })}</span>` : ' · ' + t('alle Änderungen gesichert'));
      $('btnSnapshot').style.display = '';
    } else {
      el.innerHTML = t('Termux-Server nicht erreichbar.') +
        (pending.length ? ' ' + t('{n} Änderung(en) werden nachgeholt, sobald er läuft.', { n: pending.length }) : '');
      $('btnSnapshot').style.display = 'none';
    }
  }

  // Startup: is the server there? If local data is empty but the server has a backup, offer to restore.
  async function initBackup() {
    try {
      const r = await fetch('/api/ping', { cache: 'no-store' });
      backupServer = r.ok && (await r.json()).ok === true;
    } catch (e) { backupServer = false; }
    if (backupServer) localStorage.setItem('fnfc_serverSeen', '1');
    else if (!localStorage.getItem('fnfc_serverSeen') && pending.length) { pending = []; localStorage.removeItem('fnfc_pending'); }
    showBackupStatus();
    if (!backupServer) return;

    // Browser data was cleared? Offer the server's copy.
    if (!spools.length && !localStorage.getItem('fnfc_settings')) {
      try {
        const state = await (await fetch('/api/state', { cache: 'no-store' })).json();
        if (state.spools && state.spools.length &&
            confirm(t('Keine lokalen Daten, aber eine Sicherung mit {n} Spule(n) gefunden. Wiederherstellen?', { n: state.spools.length }))) {
          if (state.settings) settings = state.settings;
          for (const k in DEFAULT_SETTINGS) if (!settings[k]) settings[k] = clone(DEFAULT_SETTINGS[k]);
          spools = state.spools;
          localStorage.setItem('fnfc_settings', JSON.stringify(settings));
          saveSpools();
          initApp();
        }
      } catch (e) { /* no backup available */ }
    }

    await flushJournal();
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('fnfc_lastSnapshot') !== today && (spools.length || localStorage.getItem('fnfc_settings'))) sendSnapshot();
  }

  // ===================================================================
  // STORAGE WITHOUT SERVER (the normal case on GitHub Pages)
  // ===================================================================
  // opts = switches in Settings → Backup. Object.assign merges the saved
  // values over the defaults, so new options get a default automatically.
  let opts = Object.assign({ dailyFile: true, autoAdd: true }, loadJSON('fnfc_opts', {}));
  function setOpt(k, v) { opts[k] = v; localStorage.setItem('fnfc_opts', JSON.stringify(opts)); showStorageStatus(); }

  // Backup reminder. A web page may not write files silently – only right
  // after a user tap. So we don't download anything automatically; we only
  // remember that something changed (fnfc_dirty) and, if the last backup file
  // is older than BACKUP_DAYS, show a notice in Settings plus a dot on the tab.
  const BACKUP_DAYS = 7;
  function dailyFileBackup() {           // called after every change (name kept for history)
    localStorage.setItem('fnfc_dirty', '1');
    showBackupBar();
  }

  // Decide whether the reminder is due and show/hide it. Days = ms difference / 86 400 000.
  function showBackupBar() {
    const bar = $('backupBar');
    const last = localStorage.getItem('fnfc_lastFile');
    const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : Infinity;
    const due = opts.dailyFile && !backupServer && localStorage.getItem('fnfc_dirty') && spools.length && days >= BACKUP_DAYS;
    bar.style.display = due ? '' : 'none';
    $('settingsBadge').style.display = due ? '' : 'none';
    if (due) $('backupBarText').textContent = last
      ? t('Letzte Sicherungsdatei vor {d} Tagen – es gibt neue Änderungen.', { d: days })
      : t('Noch keine Sicherungsdatei angelegt.');
  }

  // "Back up now" / "Export backup" buttons.
  function manualBackup() {
    exportBackup();
    showBackupBar();
    showStorageStatus();
  }

  // Persistent storage: by default Android may delete website data when the
  // phone runs low on space. navigator.storage.persist() asks to exempt this
  // app; installed apps usually get it granted.
  let persisted = null;
  async function showStorageStatus() {
    $('optDailyFile').checked = !!opts.dailyFile;
    $('optAutoAdd').checked = !!opts.autoAdd;
    const last = localStorage.getItem('fnfc_lastFile') || t('noch keine');
    $('storageStatus').innerHTML =
      (persisted ? '✔ ' + t('Daten dauerhaft gespeichert (Android löscht sie nicht bei Speichermangel).')
                 : '⚠ ' + t('Speicher nicht als dauerhaft markiert – App über „Installieren“ hinzufügen.')) +
      '<br>' + t('Letzte Sicherungsdatei: {d} · {n} Spule(n) im Inventar', { d: esc(last), n: spools.length });
  }

  async function initStorage() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        persisted = await navigator.storage.persisted() || await navigator.storage.persist();
      }
    } catch (e) { persisted = false; }
    showStorageStatus();
  }

  // Register the service worker (sw.js): a small script the browser keeps
  // running in the background. It caches the app files so the app starts
  // offline and can be installed. Not possible when opened as a local file.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

          <li>Tap <b>Write to NFC tag</b>, then hold the phone to the tag (middle of the back) until “✔ Written to tag” appears.</li>
        </ol>
        <p class="hint">“Tag usage” shows how full the tag gets. If it is too full, the app won't write.</p></details>
      <details class="card"><summary>3. Read a spool</summary>
        <p>Tap <b>Read NFC tag</b> and hold the phone to the spool. The scanner stays active, so you can read several spools in a row. Unknown spools are added to the inventory automatically (can be turned off in Settings). Foreign OpenSpool tags are recognised too.</p></details>
      <details class="card"><summary>4. Update remaining weight</summary>
        <p class="hint">The app suggests the empty weight based on brand and spool size: either from <b>Settings → Brands</b> (tap a brand) or learned from your previous spools.</p>
        <ol><li>Read the spool.</li><li>Put it on a kitchen scale and enter the value under <b>Scale gross</b> – net weight is calculated from the empty spool weight.</li><li>Write to NFC tag.</li></ol></details>
      <details class="card"><summary>5. Export a slicer profile</summary>
        <p>Each printer card has <b>PrusaSlicer</b> and <b>Orca</b> buttons. The file is saved to “Downloads”.</p>
        <ul>
          <li><b>PrusaSlicer:</b> File → Import → Import Config Bundle. A separate filament profile is created.</li>
          <li><b>OrcaSlicer:</b> File → Import → Import Configs.</li>
        </ul>
        <p class="hint">Exported: temperature, bed, flow, pressure advance, max volumetric speed and retraction. Cooling etc. get default values – check after the first import.</p></details>
      <details class="card"><summary>6. What is stored on the tag?</summary>
        <p>A JSON record in the open <b>OpenSpool</b> format (brand, type, color_hex, min_temp …) that other apps and printers can read, plus your extra data. Each printer profile is one short, readable line:</p>
        <p><code>"PCO":"T215 B55 F0.98 PA0.04 MF15 R0.8/35"</code></p>
        <ul class="hint">
          <li><b>T</b> nozzle °C · <b>B</b> bed °C (missing = spool value) · <b>F</b> flow</li>
          <li><b>PA</b> pressure advance · <b>MF</b> max volumetric speed mm³/s</li>
          <li><b>R</b> retraction length mm / speed mm/s</li>
        </ul>
        <p class="hint">NTAG215 fits 5 printer profiles, NTAG216 many more.</p></details>
      <details class="card"><summary>7. Backup</summary>
        <ul>
          <li>Data is stored inside the app on your phone.</li>
          <li>If there are changes and the last backup file is older than 7 days, the <b>Settings</b> tab shows a yellow dot and a notice under Backup. <b>Back up now</b> saves the file to “Downloads”. Available any time via <b>Settings → Export backup</b>.</li>
          <li>Restore: <b>Settings → Import backup</b> – or simply scan all spools, as all important data is on the tags.</li>
        </ul></details>
      <details class="card"><summary>8. Problems?</summary>
        <ul>
          <li><b>“Web NFC not available”:</b> only Chrome on Android supports NFC in the browser. Start the app via the installed icon.</li>
          <li><b>Tag not detected:</b> is NFC on? Move the phone slowly across the back, remove cases with metal.</li>
          <li><b>Write error:</b> the tag may be write-protected or too small (NTAG213).</li>
          <li><b>New version:</b> the app updates itself when started with internet; open it twice if needed.</li>
        </ul></details>`
  };
  function renderHelp() { $('helpContent').innerHTML = HELP[LANG] || HELP.en; }

  // ===================================================================
  // STARTUP – runs once when the page is loaded
  // ===================================================================
  // Translate the static HTML, then watch for elements added later
  // (MutationObserver = callback whenever the page structure changes).
  translateNode(document.body);
  if (LANG !== 'de') new MutationObserver(muts => {
    for (const m of muts) for (const n of m.addedNodes) translateNode(n);
  }).observe(document.body, { childList: true, subtree: true });
  try { $('selLang').value = localStorage.getItem('fnfc_lang') || 'auto'; } catch (e) {}
  renderHelp();

  initApp();
  initStorage();
  initBackup().then(showBackupBar);
</script>
</body>
</html>
